<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Adventures of Trishu">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="description" content="Adventures of Trishu - 16 joyful toddler mini-games featuring Peppa Pig, Trishu, and farmyard friends!">
  <meta property="og:title" content="Adventures of Trishu">
  <meta property="og:description" content="16 joyful toddler mini-games featuring Peppa Pig, Trishu, and farmyard friends!">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./icons/icon-512.png">
  <title>Adventures of Trishu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #81D4FA;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      font-family: "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #81D4FA;
    }

    #gameCanvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #81D4FA;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to main content</a>
  <div id="root"><main id="main"></main></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
