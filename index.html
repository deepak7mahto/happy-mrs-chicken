<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Peppa Pig: Happy Mrs Chicken</title>
  <style>
    /* ==========================================================================
       RESET & HIGH-DPI CARTOON FRAMING STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a; /* Deep midnight blue exterior letterbox */
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      font-family: "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #0f172a;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #1e293b;
      cursor: pointer;
    }

    /* Accessibility / Testing DOM Overlays (Hidden offscreen or pointer-through) */
    .mode-card-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <!-- DOM elements to satisfy semantic queries and accessibility -->
    <div class="mode-card-container">
      <button class="mode-card" data-mode="EGG_LAYING" aria-label="Happy Mrs Chicken Classic Mode" tabindex="-1">Classic Mode</button>
      <button class="mode-card" data-mode="MUDDY_PUDDLES" aria-label="Muddy Puddles Mode" tabindex="-1">Muddy Puddles</button>
      <button class="mode-card" data-mode="CHICK_MAZE" aria-label="Chick Maze Mode" tabindex="-1">Chick Maze</button>
      <button class="mode-card" data-mode="DADDY_PIG" aria-label="Daddy Pig Challenge Mode" tabindex="-1">Daddy Pig Challenge</button>
      <button id="audio-toggle-btn" aria-label="Toggle Audio" tabindex="-1">Mute/Unmute</button>
    </div>
  </div>

  <script>
    'use strict';

    // Hermetic tracking for offline test suites
    window.__NETWORK_FAILS__ = [];

    // =========================================================================
    // SECTION 1: PROCEDURAL CARTOON COLOR PALETTE & VECTOR ART SUBSYSTEM
    // =========================================================================
    const PALETTE = {
      // Characters - Mrs Chicken
      CHICKEN_BODY: '#FFFFFF',
      CHICKEN_OUTLINE: '#37474F',
      CHICKEN_COMB: '#E53935',
      CHICKEN_COMB_OUTLINE: '#B71C1C',
      CHICKEN_WATTLE: '#E53935',
      CHICKEN_BEAK: '#FFA000',
      CHICKEN_BEAK_OUTLINE: '#E65100',
      CHICKEN_LEGS: '#FF8F00',
      CHICKEN_WING_SHADOW: '#ECEFF1',
      CHICKEN_EYE: '#212121',

      // Characters - Baby Chicks
      CHICK_BODY: '#FFEE58',
      CHICK_OUTLINE: '#F57F17',
      CHICK_BEAK: '#FF6F00',
      CHICK_CHEEK: '#FF8A80',
      CHICK_WING_SHADOW: '#FDD835',
      CHICK_EYE: '#212121',

      // Characters - Peppa Pig
      PEPPA_SKIN: '#FFB6C1',
      PEPPA_OUTLINE: '#E06A8B',
      PEPPA_CHEEK: '#FF69B4',
      PEPPA_DRESS: '#E53935',
      PEPPA_DRESS_OUTLINE: '#B71C1C',
      PEPPA_BOOTS: '#FDD835',
      PEPPA_BOOTS_OUTLINE: '#C49000',

      // Characters - George Pig
      GEORGE_SKIN: '#FFB6C1',
      GEORGE_OUTLINE: '#E06A8B',
      GEORGE_CHEEK: '#FF69B4',
      GEORGE_SHIRT: '#1E88E5',
      GEORGE_SHIRT_OUTLINE: '#0D47A1',
      DINOSAUR_GREEN: '#4CAF50',
      DINOSAUR_OUTLINE: '#2E7D32',
      DINOSAUR_SPINE: '#E91E63',

      // Characters - Daddy Pig
      DADDY_SKIN: '#FFB6C1',
      DADDY_OUTLINE: '#E06A8B',
      DADDY_OUTFIT: '#00ACC1',
      DADDY_OUTFIT_OUTLINE: '#006064',
      DADDY_GLASSES: '#5D4037',
      DADDY_STUBBLE: '#4E342E',
      DADDY_SHOES: '#212121',
      DADDY_OVERHEAT: '#EF5350',
      DADDY_SWEAT: '#29B6F6',

      // Environment & Scenery
      SKY_TOP: '#4FC3F7',
      SKY_BOTTOM: '#B3E5FC',
      SUN_YELLOW: '#FFEE58',
      SUN_RAY: '#FFF59D',
      SUN_FACE: '#F57F17',
      CLOUD_WHITE: '#FFFFFF',
      CLOUD_SHADOW: '#ECEFF1',
      HILL_BACK: '#81C784',
      HILL_BACK_OUTLINE: '#4CAF50',
      HILL_FRONT: '#66BB6A',
      HILL_FRONT_OUTLINE: '#388E3C',
      GRASS_BLADE: '#2E7D32',

      // Farm Props
      BARN_RED: '#C62828',
      BARN_DARK: '#8E0000',
      BARN_TRIM: '#FAFAFA',
      STRAW_ROOF: '#FBC02D',
      STRAW_DARK: '#F57F17',
      NEST_STRAW: '#FBC02D',
      NEST_DARK: '#C49000',
      NEST_SHADOW: '#F57F17',
      FENCE_WOOD: '#FFFFFF',
      FENCE_OUTLINE: '#B0BEC5',
      SOIL_DARK: '#4E342E',
      FLOWER_STEM: '#43A047',

      // Mud Puddles
      MUD_DARK: '#5D4037',
      MUD_LIGHT: '#8D6E63',
      MUD_OUTLINE: '#3E2723',
      MUD_HIGHLIGHT: 'rgba(255, 255, 255, 0.45)',
      GOLDEN_PUDDLE: '#FFD54F',
      GOLDEN_PUDDLE_OUTLINE: '#FF8F00',

      // Eggs & Seeds
      EGG_SHELL: '#FFF9C4',
      EGG_OUTLINE: '#E0BA60',
      EGG_SPOT: '#FFE082',
      EGG_GOLDEN: '#FFD700',
      SEED_CORN: '#FFC107',
      SEED_OUTLINE: '#FFA000',

      // UI & Special FX
      WHITE: '#FFFFFF',
      BLACK: '#212121',
      UI_GOLD: '#FFD700',
      UI_SHADOW: 'rgba(0, 0, 0, 0.25)',
      STEAM_WHITE: 'rgba(245, 245, 245, 0.75)'
    };

    const AnimMath = {
      easeOutBack(t, overshoot = 1.70158) {
        const p = t - 1;
        return p * p * ((overshoot + 1) * p + overshoot) + 1;
      },
      easeOutElastic(t) {
        if (t === 0 || t === 1) return t;
        return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
      },
      easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      },
      preserveVolume(squashY) {
        const clampedY = Math.max(0.2, squashY);
        const scaleX = 1.0 / Math.sqrt(clampedY);
        return { scaleX, scaleY: clampedY };
      }
    };

    /**
     * Procedural Vector Drawing Functions
     */
    function drawMrsChicken(ctx, x, y, scale = 1.0, state = {}) {
      const squash = state.squash !== undefined ? state.squash : 1.0;
      const stretchX = 1.0 / Math.sqrt(Math.max(0.2, squash));
      const flap = state.flap || 0;
      const squawk = state.squawk || 0;
      const eyeBlink = !!state.eyeBlink;
      const facingLeft = !!state.facingLeft;
      const headBob = state.headBob || 0;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(facingLeft ? -scale * stretchX : scale * stretchX, scale * squash);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 1. Legs and Feet
      ctx.strokeStyle = PALETTE.CHICKEN_LEGS;
      ctx.lineWidth = 5;
      
      // Left Leg
      ctx.beginPath();
      ctx.moveTo(-15, 30); ctx.lineTo(-15, 58); ctx.lineTo(-26, 62);
      ctx.moveTo(-15, 58); ctx.lineTo(-15, 65);
      ctx.moveTo(-15, 58); ctx.lineTo(-4, 62);
      ctx.stroke();

      // Right Leg
      ctx.beginPath();
      ctx.moveTo(15, 30); ctx.lineTo(15, 58); ctx.lineTo(4, 62);
      ctx.moveTo(15, 58); ctx.lineTo(15, 65);
      ctx.moveTo(15, 58); ctx.lineTo(26, 62);
      ctx.stroke();

      // 2. Tail Feathers
      ctx.fillStyle = PALETTE.CHICKEN_BODY;
      ctx.strokeStyle = PALETTE.CHICKEN_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-42, 5);
      ctx.quadraticCurveTo(-70, -10, -65, -35);
      ctx.quadraticCurveTo(-50, -25, -48, -12);
      ctx.quadraticCurveTo(-68, -48, -45, -60);
      ctx.quadraticCurveTo(-38, -35, -32, -18);
      ctx.quadraticCurveTo(-50, -68, -25, -72);
      ctx.quadraticCurveTo(-22, -45, -18, -20);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 3. Main Body
      ctx.beginPath();
      ctx.ellipse(0, 5, 50, 44, 0, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.CHICKEN_BODY;
      ctx.fill();
      ctx.stroke();

      // 4. Head & Neck Curve
      ctx.save();
      ctx.translate(0, headBob);

      ctx.beginPath();
      ctx.moveTo(18, -10);
      ctx.quadraticCurveTo(28, -48, 34, -58);
      ctx.arc(38, -66, 22, Math.PI * 0.75, Math.PI * 1.85, false);
      ctx.quadraticCurveTo(22, -78, 6, -52);
      ctx.quadraticCurveTo(0, -28, -10, -5);
      ctx.closePath();
      ctx.fillStyle = PALETTE.CHICKEN_BODY;
      ctx.fill();
      ctx.stroke();

      // 5. Red Comb
      ctx.fillStyle = PALETTE.CHICKEN_COMB;
      ctx.strokeStyle = PALETTE.CHICKEN_COMB_OUTLINE;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(26, -88, 10, 0, Math.PI * 2);
      ctx.arc(40, -94, 13, 0, Math.PI * 2);
      ctx.arc(55, -88, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 6. Red Wattle
      ctx.beginPath();
      ctx.ellipse(58, -52, 7.5, 13, Math.PI * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 7. Beak
      const beakGap = squawk * 14;
      ctx.fillStyle = PALETTE.CHICKEN_BEAK;
      ctx.strokeStyle = PALETTE.CHICKEN_BEAK_OUTLINE;
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(52, -70); ctx.lineTo(80, -62 - beakGap * 0.4); ctx.lineTo(54, -58);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(54, -56); ctx.lineTo(76, -54 + beakGap * 0.8); ctx.lineTo(48, -50);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // 8. Eyes
      if (!eyeBlink) {
        ctx.fillStyle = PALETTE.WHITE;
        ctx.strokeStyle = PALETTE.CHICKEN_OUTLINE;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(33, -70, 7.5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = PALETTE.CHICKEN_EYE;
        ctx.beginPath();
        ctx.arc(35, -70, 3.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = PALETTE.WHITE;
        ctx.beginPath();
        ctx.arc(46, -70, 8, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = PALETTE.CHICKEN_EYE;
        ctx.beginPath();
        ctx.arc(48, -70, 4.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = PALETTE.WHITE;
        ctx.beginPath();
        ctx.arc(49.5, -72, 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = PALETTE.CHICKEN_OUTLINE;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(33, -70, 6.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(46, -70, 7, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
      }

      ctx.restore();

      // 9. Animated Wing
      ctx.save();
      ctx.translate(-5, 0);
      ctx.rotate(flap);
      ctx.fillStyle = PALETTE.CHICKEN_WING_SHADOW;
      ctx.strokeStyle = PALETTE.CHICKEN_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(-6, 6, 28, 19, Math.PI * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#CFD8DC';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-18, 2);
      ctx.quadraticCurveTo(-6, 8, 12, 10);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function drawBabyChick(ctx, x, y, scale = 1.0, state = {}) {
      const walkCycle = state.walkCycle || 0;
      const facingLeft = !!state.facingLeft;
      const isPeeping = !!state.isPeeping;
      const eyeBlink = !!state.eyeBlink;
      const inShell = !!state.inShell;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(facingLeft ? -scale : scale, scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (!inShell) {
        const legLeftY = Math.sin(walkCycle) * 5;
        const legRightY = -Math.sin(walkCycle) * 5;
        ctx.strokeStyle = PALETTE.CHICK_BEAK;
        ctx.lineWidth = 3.5;

        ctx.beginPath();
        ctx.moveTo(-7, 10); ctx.lineTo(-7, 20 + legLeftY); ctx.lineTo(-13, 22 + legLeftY);
        ctx.moveTo(-7, 20 + legLeftY); ctx.lineTo(-2, 22 + legLeftY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(7, 10); ctx.lineTo(7, 20 + legRightY); ctx.lineTo(1, 22 + legRightY);
        ctx.moveTo(7, 20 + legRightY); ctx.lineTo(13, 22 + legRightY);
        ctx.stroke();
      }

      ctx.fillStyle = PALETTE.CHICK_BODY;
      ctx.strokeStyle = PALETTE.CHICK_OUTLINE;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Head tuft
      ctx.beginPath();
      ctx.moveTo(-3, -17); ctx.quadraticCurveTo(0, -25, 5, -23); ctx.quadraticCurveTo(3, -18, 1, -17);
      ctx.fill(); ctx.stroke();

      // Cheek
      ctx.fillStyle = PALETTE.CHICK_CHEEK;
      ctx.beginPath();
      ctx.arc(8, 2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = PALETTE.CHICK_BEAK;
      ctx.strokeStyle = '#E65100';
      ctx.lineWidth = 2.5;
      const peepGap = isPeeping ? 4 : 0;
      ctx.beginPath();
      ctx.moveTo(15, -4); ctx.lineTo(26, -1 - peepGap * 0.5); ctx.lineTo(15, 2);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      if (isPeeping) {
        ctx.beginPath();
        ctx.moveTo(15, 2); ctx.lineTo(24, 5 + peepGap); ctx.lineTo(13, 5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }

      // Eyes
      if (!eyeBlink) {
        ctx.fillStyle = PALETTE.WHITE;
        ctx.strokeStyle = PALETTE.BLACK;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(7, -7, 5.5, 0, Math.PI * 2);
        ctx.arc(15, -7, 5.5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = PALETTE.BLACK;
        ctx.beginPath();
        ctx.arc(8.5, -7, 2.8, 0, Math.PI * 2);
        ctx.arc(16.5, -7, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = PALETTE.WHITE;
        ctx.beginPath();
        ctx.arc(9.5, -8.5, 1.2, 0, Math.PI * 2);
        ctx.arc(17.5, -8.5, 1.2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = PALETTE.BLACK;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(7, -7, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.arc(15, -7, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
      }

      // Wing
      const wingAngle = Math.sin(walkCycle * 2) * 0.35;
      ctx.save();
      ctx.translate(-7, 2);
      ctx.rotate(wingAngle);
      ctx.fillStyle = PALETTE.CHICK_WING_SHADOW;
      ctx.strokeStyle = PALETTE.CHICK_OUTLINE;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(-2, 0, 9, 6, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Half Shell
      if (inShell) {
        ctx.fillStyle = PALETTE.EGG_SHELL;
        ctx.strokeStyle = PALETTE.EGG_OUTLINE;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-22, 0); ctx.lineTo(-14, 5); ctx.lineTo(-6, -2); ctx.lineTo(2, 6);
        ctx.lineTo(10, -1); ctx.lineTo(18, 5); ctx.lineTo(22, 0);
        ctx.quadraticCurveTo(24, 22, 0, 24);
        ctx.quadraticCurveTo(-24, 22, -22, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      ctx.restore();
    }

    function drawPeppaPig(ctx, x, y, scale = 1.0, state = {}) {
      const jumpY = state.jumpY || 0;
      const squish = state.squish !== undefined ? state.squish : 1.0;
      const stretchX = 1.0 / Math.sqrt(Math.max(0.3, squish));
      const armWave = state.armWave || 0;
      const facingLeft = !!state.facingLeft;

      ctx.save();
      ctx.translate(x, y + jumpY);
      ctx.scale(facingLeft ? -scale * stretchX : scale * stretchX, scale * squish);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Boots
      ctx.fillStyle = PALETTE.PEPPA_BOOTS;
      ctx.strokeStyle = PALETTE.PEPPA_BOOTS_OUTLINE;
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(-18, 50); ctx.lineTo(-18, 70); ctx.lineTo(-32, 70);
      ctx.arcTo(-36, 70, -36, 62, 6); ctx.lineTo(-25, 62); ctx.lineTo(-25, 50);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(6, 50); ctx.lineTo(6, 70); ctx.lineTo(-8, 70);
      ctx.arcTo(-12, 70, -12, 62, 6); ctx.lineTo(-1, 62); ctx.lineTo(-1, 50);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Legs
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-21, 38); ctx.lineTo(-21, 50);
      ctx.moveTo(3, 38); ctx.lineTo(3, 50);
      ctx.stroke();

      // Tail
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-34, 25);
      ctx.bezierCurveTo(-50, 18, -55, 36, -42, 36);
      ctx.bezierCurveTo(-34, 36, -48, 50, -44, 54);
      ctx.stroke();

      // Dress
      ctx.fillStyle = PALETTE.PEPPA_DRESS;
      ctx.strokeStyle = PALETTE.PEPPA_DRESS_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-12, -10); ctx.lineTo(12, -10); ctx.lineTo(34, 40);
      ctx.quadraticCurveTo(0, 45, -34, 40);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Arms
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 4;
      const leftArmY = Math.sin(armWave) * 12;
      ctx.beginPath();
      ctx.moveTo(-20, 6); ctx.lineTo(-42, -6 + leftArmY); ctx.lineTo(-50, -14 + leftArmY);
      ctx.moveTo(-42, -6 + leftArmY); ctx.lineTo(-52, -6 + leftArmY);
      ctx.moveTo(-42, -6 + leftArmY); ctx.lineTo(-48, 2 + leftArmY);
      ctx.stroke();

      const rightArmY = -Math.sin(armWave) * 12;
      ctx.beginPath();
      ctx.moveTo(20, 6); ctx.lineTo(44, -6 + rightArmY); ctx.lineTo(52, -14 + rightArmY);
      ctx.moveTo(44, -6 + rightArmY); ctx.lineTo(54, -6 + rightArmY);
      ctx.moveTo(44, -6 + rightArmY); ctx.lineTo(50, 2 + rightArmY);
      ctx.stroke();

      // Head & Snout
      ctx.fillStyle = PALETTE.PEPPA_SKIN;
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-20, -15);
      ctx.bezierCurveTo(-42, -30, -38, -65, 0, -65);
      ctx.lineTo(26, -65);
      ctx.ellipse(46, -55, 12, 18, 0, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.lineTo(20, -45);
      ctx.quadraticCurveTo(15, -15, -20, -15);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Nostrils
      ctx.fillStyle = PALETTE.PEPPA_OUTLINE;
      ctx.beginPath();
      ctx.arc(43, -58, 2.6, 0, Math.PI * 2);
      ctx.arc(49, -54, 2.6, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = PALETTE.PEPPA_SKIN;
      ctx.beginPath();
      ctx.ellipse(-10, -76, 6.5, 14, -0.15, 0, Math.PI * 2);
      ctx.ellipse(8, -76, 6.5, 14, 0.15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Cheek
      ctx.fillStyle = PALETTE.PEPPA_CHEEK;
      ctx.beginPath();
      ctx.arc(-9, -32, 12.5, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = PALETTE.WHITE;
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(10, -56, 7.5, 0, Math.PI * 2);
      ctx.arc(26, -56, 7.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = PALETTE.BLACK;
      ctx.beginPath();
      ctx.arc(12, -56, 3.6, 0, Math.PI * 2);
      ctx.arc(28, -56, 3.6, 0, Math.PI * 2);
      ctx.fill();

      // Smile
      ctx.strokeStyle = PALETTE.PEPPA_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(12, -32, 11, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    function drawGeorgePig(ctx, x, y, scale = 0.82, state = {}) {
      const jumpY = state.jumpY || 0;
      const squish = state.squish !== undefined ? state.squish : 1.0;
      const stretchX = 1.0 / Math.sqrt(Math.max(0.3, squish));
      const facingLeft = !!state.facingLeft;
      const holdingDino = state.holdingDino !== false;

      ctx.save();
      ctx.translate(x, y + jumpY);
      ctx.scale(facingLeft ? -scale * stretchX : scale * stretchX, scale * squish);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Boots
      ctx.fillStyle = PALETTE.PEPPA_BOOTS;
      ctx.strokeStyle = PALETTE.PEPPA_BOOTS_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-16, 45); ctx.lineTo(-16, 62); ctx.lineTo(-28, 62);
      ctx.arcTo(-32, 62, -32, 54, 5); ctx.lineTo(-22, 54); ctx.lineTo(-22, 45);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(5, 45); ctx.lineTo(5, 62); ctx.lineTo(-7, 62);
      ctx.arcTo(-11, 62, -11, 54, 5); ctx.lineTo(-1, 54); ctx.lineTo(-1, 45);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Legs
      ctx.strokeStyle = PALETTE.GEORGE_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-18, 35); ctx.lineTo(-18, 45);
      ctx.moveTo(2, 35); ctx.lineTo(2, 45);
      ctx.stroke();

      // Shirt
      ctx.fillStyle = PALETTE.GEORGE_SHIRT;
      ctx.strokeStyle = PALETTE.GEORGE_SHIRT_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-10, -8); ctx.lineTo(10, -8); ctx.lineTo(28, 36);
      ctx.quadraticCurveTo(0, 40, -28, 36);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Head
      ctx.fillStyle = PALETTE.GEORGE_SKIN;
      ctx.strokeStyle = PALETTE.GEORGE_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-18, -12); ctx.bezierCurveTo(-38, -25, -34, -58, 0, -58);
      ctx.lineTo(22, -58);
      ctx.ellipse(40, -48, 10, 16, 0, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.lineTo(18, -38);
      ctx.quadraticCurveTo(12, -12, -18, -12);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Nostrils & Ears & Eyes
      ctx.fillStyle = PALETTE.GEORGE_OUTLINE;
      ctx.beginPath();
      ctx.arc(37, -51, 2.3, 0, Math.PI * 2);
      ctx.arc(43, -47, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = PALETTE.GEORGE_SKIN;
      ctx.beginPath();
      ctx.ellipse(-8, -66, 5.5, 12, -0.15, 0, Math.PI * 2);
      ctx.ellipse(6, -66, 5.5, 12, 0.15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = PALETTE.GEORGE_CHEEK;
      ctx.beginPath(); ctx.arc(-8, -26, 10, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = PALETTE.WHITE;
      ctx.strokeStyle = PALETTE.GEORGE_OUTLINE;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(8, -50, 6.5, 0, Math.PI * 2);
      ctx.arc(22, -50, 6.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = PALETTE.BLACK;
      ctx.beginPath();
      ctx.arc(10, -50, 3.2, 0, Math.PI * 2);
      ctx.arc(24, -50, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = PALETTE.GEORGE_OUTLINE;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(10, -28, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

      // Mr Dinosaur
      if (holdingDino) {
        ctx.save();
        ctx.translate(22, 10);
        ctx.rotate(0.2);
        ctx.fillStyle = PALETTE.DINOSAUR_GREEN;
        ctx.strokeStyle = PALETTE.DINOSAUR_OUTLINE;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-10, 15); ctx.quadraticCurveTo(-22, 18, -26, 8);
        ctx.quadraticCurveTo(-15, 0, -5, -12); ctx.quadraticCurveTo(12, -18, 16, -10);
        ctx.lineTo(8, -2); ctx.quadraticCurveTo(8, 12, -10, 15);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.fillStyle = PALETTE.DINOSAUR_SPINE;
        ctx.beginPath();
        ctx.moveTo(-8, -14); ctx.lineTo(-6, -20); ctx.lineTo(-4, -13);
        ctx.moveTo(-14, -6); ctx.lineTo(-15, -12); ctx.lineTo(-10, -5);
        ctx.moveTo(-20, 2); ctx.lineTo(-23, -3); ctx.lineTo(-17, 3);
        ctx.fill();

        ctx.fillStyle = PALETTE.BLACK;
        ctx.beginPath(); ctx.arc(10, -12, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawDaddyPig(ctx, x, y, scale = 1.25, state = {}) {
      const panicStage = state.panicStage || 0;
      const overheat = state.overheatProgress || 0;
      const time = state.time || 0;
      const facingLeft = !!state.facingLeft;

      let shakeX = 0;
      let shakeY = 0;
      if (panicStage === 2) {
        shakeX = (Math.sin(time * 45) + Math.cos(time * 33)) * 1.8;
        shakeY = (Math.cos(time * 40)) * 1.2;
      } else if (panicStage >= 3) {
        shakeX = (Math.sin(time * 60) + (Math.random() - 0.5) * 2) * 4.0;
        shakeY = (Math.cos(time * 55) + (Math.random() - 0.5) * 2) * 3.5;
      }

      ctx.save();
      ctx.translate(x + shakeX, y + shakeY);
      ctx.scale(facingLeft ? -scale : scale, scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Large Body
      const isCrashing = panicStage >= 3 || overheat >= 0.95;
      ctx.fillStyle = isCrashing ? PALETTE.DADDY_OVERHEAT : PALETTE.DADDY_OUTFIT;
      ctx.strokeStyle = isCrashing ? '#B71C1C' : PALETTE.DADDY_OUTFIT_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.ellipse(0, 32, 54, 50, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Legs & Shoes
      ctx.strokeStyle = PALETTE.DADDY_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-22, 78); ctx.lineTo(-22, 98);
      ctx.moveTo(22, 78); ctx.lineTo(22, 98);
      ctx.stroke();

      ctx.fillStyle = PALETTE.DADDY_SHOES;
      ctx.strokeStyle = PALETTE.BLACK;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.ellipse(-28, 99, 13, 7, 0, 0, Math.PI * 2);
      ctx.ellipse(28, 99, 13, 7, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Head & Snout
      ctx.fillStyle = PALETTE.DADDY_SKIN;
      ctx.strokeStyle = PALETTE.DADDY_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-26, -20);
      ctx.bezierCurveTo(-52, -42, -48, -88, 0, -88);
      ctx.lineTo(36, -88);
      ctx.ellipse(62, -74, 16, 23, 0, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.lineTo(26, -60);
      ctx.quadraticCurveTo(20, -20, -26, -20);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Nostrils & Ears
      ctx.fillStyle = PALETTE.DADDY_OUTLINE;
      ctx.beginPath();
      ctx.arc(60, -78, 3.2, 0, Math.PI * 2);
      ctx.arc(67, -72, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = PALETTE.DADDY_SKIN;
      ctx.beginPath();
      ctx.ellipse(-16, -98, 7.5, 17, -0.15, 0, Math.PI * 2);
      ctx.ellipse(10, -98, 7.5, 17, 0.15, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Stubble
      ctx.fillStyle = PALETTE.DADDY_STUBBLE;
      const stubbleDots = [
        [-12, -32], [-6, -36], [0, -30], [8, -35], [16, -30],
        [-8, -24], [2, -22], [12, -24], [22, -28], [28, -34],
        [-2, -18], [8, -17], [18, -18]
      ];
      for (const [sx, sy] of stubbleDots) {
        ctx.beginPath(); ctx.arc(sx, sy, 1.6, 0, Math.PI * 2); ctx.fill();
      }

      // Spectacles (Glasses)
      ctx.strokeStyle = PALETTE.DADDY_GLASSES;
      ctx.lineWidth = 4;
      ctx.fillStyle = PALETTE.WHITE;
      ctx.beginPath();
      ctx.arc(16, -74, 12, 0, Math.PI * 2);
      ctx.arc(40, -74, 12, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(28, -74); ctx.lineTo(28, -74);
      ctx.moveTo(4, -74); ctx.lineTo(-16, -70);
      ctx.stroke();

      // Eyes
      if (panicStage < 3) {
        ctx.fillStyle = PALETTE.BLACK;
        ctx.beginPath();
        ctx.arc(18, -74, panicStage === 1 ? 4.5 : 3.8, 0, Math.PI * 2);
        ctx.arc(42, -74, panicStage === 1 ? 4.5 : 3.8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = PALETTE.BLACK;
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let theta = 0; theta < Math.PI * 4; theta += 0.2) {
          const r = theta * 1.8;
          const ex = 16 + Math.cos(theta + time * 15) * r;
          const ey = -74 + Math.sin(theta + time * 15) * r;
          if (theta === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
        }
        ctx.stroke();

        ctx.beginPath();
        for (let theta = 0; theta < Math.PI * 4; theta += 0.2) {
          const r = theta * 1.8;
          const ex = 40 + Math.cos(theta - time * 15) * r;
          const ey = -74 + Math.sin(theta - time * 15) * r;
          if (theta === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
        }
        ctx.stroke();
      }

      // Mouth
      ctx.strokeStyle = PALETTE.DADDY_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (panicStage === 0) {
        ctx.arc(22, -45, 12, 0.1 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      } else if (panicStage === 1) {
        ctx.arc(24, -44, 10, 0.15 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
      } else if (panicStage === 2) {
        ctx.moveTo(6, -46); ctx.quadraticCurveTo(14, -40, 22, -48);
        ctx.quadraticCurveTo(30, -56, 38, -44); ctx.quadraticCurveTo(44, -38, 48, -46);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#C62828';
        ctx.beginPath();
        ctx.ellipse(26, -44, 14, 18, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FF8A80';
        ctx.beginPath(); ctx.arc(26, -34, 10, Math.PI, 0); ctx.fill();
      }

      ctx.restore();
    }

    function drawHenCoop(ctx, x, y, width = 280, height = 240) {
      ctx.save();
      ctx.translate(x, y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.fillStyle = PALETTE.BARN_RED;
      ctx.strokeStyle = PALETTE.BARN_DARK;
      ctx.lineWidth = 4;
      ctx.fillRect(-width * 0.5, -height * 0.7, width, height * 0.7);
      ctx.strokeRect(-width * 0.5, -height * 0.7, width, height * 0.7);

      ctx.strokeStyle = PALETTE.BARN_DARK;
      ctx.lineWidth = 2.5;
      for (let px = -width * 0.5 + 30; px < width * 0.5; px += 30) {
        ctx.beginPath(); ctx.moveTo(px, -height * 0.7); ctx.lineTo(px, 0); ctx.stroke();
      }

      ctx.fillStyle = PALETTE.BARN_TRIM;
      ctx.strokeStyle = '#B0BEC5';
      ctx.lineWidth = 3;
      ctx.fillRect(-width * 0.5 - 6, -height * 0.7, 14, height * 0.7);
      ctx.strokeRect(-width * 0.5 - 6, -height * 0.7, 14, height * 0.7);
      ctx.fillRect(width * 0.5 - 8, -height * 0.7, 14, height * 0.7);
      ctx.strokeRect(width * 0.5 - 8, -height * 0.7, 14, height * 0.7);

      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(0, -height * 0.35, 42, Math.PI, 0);
      ctx.lineTo(42, 0); ctx.lineTo(-42, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = PALETTE.STRAW_ROOF;
      ctx.strokeStyle = PALETTE.STRAW_DARK;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(-width * 0.58, -height * 0.68);
      ctx.lineTo(0, -height * 1.05);
      ctx.lineTo(width * 0.58, -height * 0.68);
      for (let sx = width * 0.58; sx >= -width * 0.58; sx -= 25) {
        ctx.lineTo(sx - 12, -height * 0.65 + (sx % 2 === 0 ? 8 : 0));
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.restore();
    }

    function drawHayNest(ctx, x, y, width = 160, height = 70) {
      ctx.save();
      ctx.translate(x, y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.fillStyle = PALETTE.NEST_SHADOW;
      ctx.beginPath();
      ctx.ellipse(0, 10, width * 0.52, height * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = PALETTE.NEST_STRAW;
      ctx.strokeStyle = PALETTE.NEST_DARK;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, 0, width * 0.5, height * 0.4, 0, 0, Math.PI);
      ctx.fill(); ctx.stroke();

      ctx.strokeStyle = PALETTE.NEST_DARK;
      ctx.lineWidth = 3;
      const strawWisps = [
        [-60, 5, -80, 15], [-40, 12, -55, 26], [-20, 18, -25, 32],
        [0, 20, 5, 35], [25, 18, 38, 30], [50, 10, 72, 22], [65, 0, 85, 8]
      ];
      for (const [x1, y1, x2, y2] of strawWisps) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo((x1 + x2) * 0.5 + 4, (y1 + y2) * 0.5 + 8, x2, y2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMuddyPuddle(ctx, x, y, radiusX = 65, radiusY = 32, options = {}) {
      const isGolden = options.type === 'GOLDEN';
      const ripplePhase = options.ripplePhase || 0;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = isGolden ? PALETTE.GOLDEN_PUDDLE : PALETTE.MUD_DARK;
      ctx.strokeStyle = isGolden ? PALETTE.GOLDEN_PUDDLE_OUTLINE : PALETTE.MUD_OUTLINE;
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(-radiusX, 0);
      ctx.bezierCurveTo(-radiusX, -radiusY * 0.9, -radiusX * 0.3, -radiusY * 1.2, 0, -radiusY);
      ctx.bezierCurveTo(radiusX * 0.4, -radiusY * 1.1, radiusX * 1.05, -radiusY * 0.7, radiusX, 0);
      ctx.bezierCurveTo(radiusX * 0.95, radiusY * 0.8, radiusX * 0.3, radiusY * 1.25, 0, radiusY);
      ctx.bezierCurveTo(-radiusX * 0.5, radiusY * 1.1, -radiusX * 1.05, radiusY * 0.6, -radiusX, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Glossy Reflection
      ctx.fillStyle = isGolden ? 'rgba(255, 255, 255, 0.65)' : PALETTE.MUD_HIGHLIGHT;
      ctx.beginPath();
      ctx.ellipse(-radiusX * 0.25, -radiusY * 0.35, radiusX * 0.45, radiusY * 0.25, -0.15, 0, Math.PI * 2);
      ctx.fill();

      // Ripple waves
      if (ripplePhase > 0) {
        const waveCount = 3;
        ctx.lineWidth = 2.5;
        for (let w = 0; w < waveCount; w++) {
          const phase = (ripplePhase + w / waveCount) % 1.0;
          const alpha = (1.0 - phase) * 0.7;
          const rx = radiusX * (0.3 + phase * 0.65);
          const ry = radiusY * (0.3 + phase * 0.65);
          ctx.strokeStyle = isGolden ? `rgba(255, 255, 255, ${alpha})` : `rgba(255, 248, 225, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function drawLandscapeSkyHills(ctx, width, height, time = 0) {
      ctx.save();

      // Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.75);
      skyGrad.addColorStop(0, PALETTE.SKY_TOP);
      skyGrad.addColorStop(1, PALETTE.SKY_BOTTOM);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Smiling Sun
      const sunX = width * 0.86;
      const sunY = height * 0.18;
      const sunRadius = 42;
      const pulse = Math.sin(time * 3) * 6;

      ctx.fillStyle = PALETTE.SUN_RAY;
      ctx.strokeStyle = PALETTE.SUN_FACE;
      ctx.lineWidth = 3;
      const rayCount = 10;
      for (let i = 0; i < rayCount; i++) {
        const angle = (Math.PI * 2 * i) / rayCount + time * 0.2;
        const r1 = sunRadius + 6;
        const r2 = sunRadius + 18 + pulse;
        ctx.beginPath();
        ctx.moveTo(sunX + Math.cos(angle - 0.15) * r1, sunY + Math.sin(angle - 0.15) * r1);
        ctx.lineTo(sunX + Math.cos(angle) * r2, sunY + Math.sin(angle) * r2);
        ctx.lineTo(sunX + Math.cos(angle + 0.15) * r1, sunY + Math.sin(angle + 0.15) * r1);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      ctx.fillStyle = PALETTE.SUN_YELLOW;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // Sun Face
      ctx.fillStyle = PALETTE.BLACK;
      ctx.beginPath();
      ctx.arc(sunX - 12, sunY - 6, 4, 0, Math.PI * 2);
      ctx.arc(sunX + 12, sunY - 6, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF8A80';
      ctx.beginPath();
      ctx.arc(sunX - 20, sunY + 6, 6, 0, Math.PI * 2);
      ctx.arc(sunX + 20, sunY + 6, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = PALETTE.SUN_FACE;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(sunX, sunY + 4, 16, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      // Puffy Clouds
      const clouds = [
        { x: ((width * 0.15 + time * 12) % (width + 200)) - 100, y: height * 0.12, s: 0.9 },
        { x: ((width * 0.55 + time * 8) % (width + 200)) - 100, y: height * 0.22, s: 1.15 }
      ];
      for (const c of clouds) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.s, c.s);
        ctx.fillStyle = PALETTE.CLOUD_WHITE;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.arc(22, -8, 20, 0, Math.PI * 2);
        ctx.arc(42, 2, 22, 0, Math.PI * 2);
        ctx.arc(20, 10, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Rolling Hills
      ctx.fillStyle = PALETTE.HILL_BACK;
      ctx.strokeStyle = PALETTE.HILL_BACK_OUTLINE;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, height * 0.62);
      ctx.quadraticCurveTo(width * 0.35, height * 0.48, width * 0.7, height * 0.58);
      ctx.quadraticCurveTo(width * 0.88, height * 0.62, width, height * 0.54);
      ctx.lineTo(width, height); ctx.lineTo(0, height);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = PALETTE.HILL_FRONT;
      ctx.strokeStyle = PALETTE.HILL_FRONT_OUTLINE;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(0, height * 0.72);
      ctx.quadraticCurveTo(width * 0.4, height * 0.82, width * 0.8, height * 0.68);
      ctx.quadraticCurveTo(width * 0.92, height * 0.65, width, height * 0.70);
      ctx.lineTo(width, height); ctx.lineTo(0, height);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.restore();
    }

    function drawEgg(ctx, x, y, scale = 1.0, rotation = 0, crackStage = 0, eggType = 'STANDARD') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const isGolden = eggType === 'GOLDEN';
      const isRainbow = eggType === 'RAINBOW';

      if (isRainbow) {
        const rainbowGrad = ctx.createLinearGradient(-16, -24, 16, 24);
        rainbowGrad.addColorStop(0, '#FF8A80');
        rainbowGrad.addColorStop(0.33, '#FFEE58');
        rainbowGrad.addColorStop(0.66, '#80D8FF');
        rainbowGrad.addColorStop(1, '#B388FF');
        ctx.fillStyle = rainbowGrad;
      } else if (isGolden) {
        ctx.fillStyle = PALETTE.EGG_GOLDEN;
      } else {
        ctx.fillStyle = PALETTE.EGG_SHELL;
      }

      ctx.strokeStyle = isGolden ? '#FF8F00' : PALETTE.EGG_OUTLINE;
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.bezierCurveTo(18, -26, 24, 6, 20, 22);
      ctx.bezierCurveTo(16, 32, -16, 32, -20, 22);
      ctx.bezierCurveTo(-24, 6, -18, -26, 0, -26);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      if (!isGolden && !isRainbow) {
        ctx.fillStyle = PALETTE.EGG_SPOT;
        ctx.beginPath();
        ctx.arc(-6, -4, 2, 0, Math.PI * 2);
        ctx.arc(8, 10, 2.5, 0, Math.PI * 2);
        ctx.arc(-4, 16, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cracking Fissures
      if (crackStage >= 1) {
        ctx.strokeStyle = PALETTE.BLACK;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-16, 2); ctx.lineTo(-6, -4); ctx.lineTo(2, 6); ctx.lineTo(12, -2);
        ctx.stroke();

        if (crackStage >= 2) {
          ctx.beginPath();
          ctx.moveTo(-6, -4); ctx.lineTo(-8, -14);
          ctx.moveTo(2, 6); ctx.lineTo(6, 16);
          ctx.stroke();
        }

        if (crackStage >= 3) {
          ctx.fillStyle = '#212121';
          ctx.beginPath();
          ctx.moveTo(-16, 2); ctx.lineTo(-6, -2); ctx.lineTo(2, 8); ctx.lineTo(12, -2);

      }

    // =========================================================================

    class ParticleEngine {
      constructor(maxParticles = 350) {
        this.maxParticles = maxParticles;
        this.active = [];
        this.pool = [];

        for (let i = 0; i < maxParticles; i++) {
          this.pool.push({
            active: false,
            type: 'EGGSHELL',
            x: 0, y: 0, vx: 0, vy: 0,
            gravity: 0.28, drag: 0.99,
            rotation: 0, vRot: 0,
            scale: 1.0, size: 8,
            life: 1.0, decay: 0.02,
            color: '#FFFFFF', bounce: 0.45,
            groundY: 510, text: '',
            wobblePhase: 0, wobbleSpeed: 5.0
          });
        }
      }

      spawn(type, x, y, options = {}) {
        if (this.active.length >= this.maxParticles) {
          const oldest = this.active.shift();
          this.pool.push(oldest);
        }

        const p = this.pool.pop() || {};
        p.active = true;
        p.type = type;
        p.x = x;
        p.y = y;
        p.vx = options.vx !== undefined ? options.vx : (Math.random() * 6 - 3);
        p.vy = options.vy !== undefined ? options.vy : (Math.random() * -6 - 2);
        p.gravity = options.gravity !== undefined ? options.gravity : 0.28;
        p.drag = options.drag !== undefined ? options.drag : 0.99;
        p.rotation = options.rotation !== undefined ? options.rotation : Math.random() * Math.PI * 2;
        p.vRot = options.vRot !== undefined ? options.vRot : (Math.random() - 0.5) * 0.25;
        p.scale = options.scale !== undefined ? options.scale : 1.0;
        p.size = options.size !== undefined ? options.size : 8;
        p.life = 1.0;
        p.decay = options.decay !== undefined ? options.decay : 0.02;
        p.color = options.color || '#FFFFFF';
        p.bounce = options.bounce !== undefined ? options.bounce : 0.45;
        p.groundY = options.groundY !== undefined ? options.groundY : 510;
        p.text = options.text || '';
        p.wobblePhase = Math.random() * Math.PI * 2;
        p.wobbleSpeed = options.wobbleSpeed || 5.0;

        this.active.push(p);
        return p;
      }

      spawnEggCrack(x, y, count = 10, eggColor = PALETTE.EGG_SHELL) {
        for (let i = 0; i < count; i++) {

      spawnScorePopup(x, y, text, color = PALETTE.UI_GOLD) {

      update(dt = 1 / 60) {
        for (let i = this.active.length - 1; i >= 0; i--) {
          const p = this.active[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= p.drag;
          p.rotation += p.vRot;
          p.life -= p.decay;

          if (p.type === 'FEATHER') {
            p.wobblePhase += p.wobbleSpeed * dt;
            p.x += Math.sin(p.wobblePhase) * 1.2;
          }

          if (p.groundY && p.y >= p.groundY) {
            p.y = p.groundY;
            p.vy = -p.vy * p.bounce;
            p.vx *= 0.65;
          }

          if (p.life <= 0) {
            p.active = false;
            this.active.splice(i, 1);
            if (this.pool.length < this.maxParticles) {
              this.pool.push(p);
            }
          }
        }
      }

      render(ctx) {
        for (let i = 0; i < this.active.length; i++) {
          const p = this.active[i];
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));

          switch (p.type) {
            case 'EGGSHELL': {
              ctx.fillStyle = p.color;
              ctx.strokeStyle = PALETTE.EGG_OUTLINE;
              ctx.lineWidth = 2;
              ctx.beginPath();
              const s = p.size;
              ctx.moveTo(-s * 0.5, -s * 0.5); ctx.lineTo(s * 0.6, -s * 0.3);
              ctx.lineTo(s * 0.3, s * 0.6); ctx.lineTo(-s * 0.4, s * 0.4);
              ctx.closePath(); ctx.fill(); ctx.stroke();
              break;
            }
            case 'MUD_DROPLET': {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size * 0.55, p.size, 0, 0, Math.PI * 2);
              ctx.fill();
              break;
            }
            case 'FEATHER': {
              ctx.fillStyle = PALETTE.WHITE;
              ctx.strokeStyle = '#CFD8DC';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size * 0.8, p.size * 0.3, Math.PI * 0.2, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              break;
            }
            case 'SPARKLE': {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              const s = p.size * (0.4 + (1.0 - p.life) * 0.6);
              ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0);
              ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0);
              ctx.quadraticCurveTo(0, 0, 0, -s);
              ctx.fill();
              break;
            }
            case 'STEAM': {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              const currentRadius = p.size * (1.0 + (1.0 - p.life) * 1.5);
              ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
              ctx.fill();
              break;
            }
            case 'POPUP_TEXT': {
              const popScale = p.scale * (1.0 + Math.sin((1.0 - p.life) * Math.PI) * 0.3);
              ctx.scale(popScale, popScale);
              ctx.font = 'bold 22px "Comic Sans MS", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.strokeStyle = PALETTE.BLACK;
              ctx.lineWidth = 4.5;
              ctx.strokeText(p.text, 0, 0);
              ctx.fillStyle = p.color;
              ctx.fillText(p.text, 0, 0);
              break;
            }
          }
          ctx.restore();
        }
      }

      clear() {
        for (const p of this.active) {
          p.active = false;
          this.pool.push(p);
        }
        this.active.length = 0;
      }

    const BGM_CHORD_MAP = {
      2: [NOTE.E4, NOTE.G4], 6: [NOTE.E4, NOTE.G4],
      10: [NOTE.F4, NOTE.A4], 14: [NOTE.F4, NOTE.A4],
      18: [NOTE.E4, NOTE.G4], 22: [NOTE.E4, NOTE.G4],
