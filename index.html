    class BGMSequencer {
      constructor(soundEngine) {
        this.snd = soundEngine;
        this.isPlaying = false;
        this.tempo = 128.0;
        this.secondsPerBeat = 60.0 / this.tempo;
        this.stepDuration = 0.5 * this.secondsPerBeat;
        this.lookaheadMs = 25.0;
        this.scheduleAheadTime = 0.12;
        this.currentStep = 0;
        this.nextStepTime = 0.0;
        this.timerID = null;
      }

      setTempo(bpm) {
        this.tempo = Math.max(60, Math.min(220, bpm));
        this.secondsPerBeat = 60.0 / this.tempo;
        this.stepDuration = 0.5 * this.secondsPerBeat;
      }

      start() {
        if (this.isPlaying || !this.snd.ctx) return;
        this.isPlaying = true;
        this.currentStep = 0;
        this.nextStepTime = this.snd.ctx.currentTime + 0.05;
        this.tick();
      }

      stop() {
        this.isPlaying = false;
        if (this.timerID) {
          clearTimeout(this.timerID);
          this.timerID = null;
        }
      }

      duckBGM(durationSec = 0.8) {
        if (!this.snd.ctx || !this.snd.bgmGain) return;
        const now = this.snd.ctx.currentTime;
        this.snd.bgmGain.gain.cancelScheduledValues(now);
        this.snd.bgmGain.gain.setValueAtTime(this.snd.bgmGain.gain.value, now);
        this.snd.bgmGain.gain.linearRampToValueAtTime(0.08, now + 0.04);
        this.snd.bgmGain.gain.setValueAtTime(0.08, now + durationSec * 0.7);
        this.snd.bgmGain.gain.linearRampToValueAtTime(0.32, now + durationSec);
      }

      tick() {
        if (!this.isPlaying || !this.snd.ctx) return;
        while (this.nextStepTime < this.snd.ctx.currentTime + this.scheduleAheadTime) {
          this.scheduleStep(this.currentStep, this.nextStepTime);
          this.advanceStep();
        }
        this.timerID = setTimeout(() => this.tick(), this.lookaheadMs);
      }

      advanceStep() {
        this.nextStepTime += this.stepDuration;
        this.currentStep++;
      }

      scheduleStep(stepIndex, time) {
        if (this.snd.isMuted) return;
        const patternStep = stepIndex % 32;

        const lead = BGM_MELODY_PATTERN[patternStep];
        if (lead && lead.note > 0) {
          this.playLeadVoice(lead.note, lead.dur * this.secondsPerBeat, time);
        }

        const bass = BGM_BASS_PATTERN[patternStep];
        if (bass && bass.note > 0) {
          this.playBassVoice(bass.note, bass.dur * this.secondsPerBeat, time);
        }

        const chordNotes = BGM_CHORD_MAP[patternStep];
        if (chordNotes && chordNotes.length > 0) {
          this.playChordVoice(chordNotes, 0.25 * this.secondsPerBeat, time);
        }

        if (patternStep % 4 === 2) {
          this.playPercussionVoice(time);
        }
      }

      playLeadVoice(freq, duration, time) {
        const osc = this.snd.ctx.createOscillator();
        const gain = this.snd.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.24, time + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.85);

        osc.connect(gain);
        gain.connect(this.snd.bgmGain);
        osc.start(time);
        osc.stop(time + duration);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      }

      playBassVoice(freq, duration, time) {
        const osc = this.snd.ctx.createOscillator();
        const filter = this.snd.ctx.createBiquadFilter();
        const gain = this.snd.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, time);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.34, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.80);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.snd.bgmGain);
        osc.start(time);
        osc.stop(time + duration);
        osc.onended = () => { osc.disconnect(); filter.disconnect(); gain.disconnect(); };
      }

      playChordVoice(notes, duration, time) {
        notes.forEach(f => {
          const osc = this.snd.ctx.createOscillator();
          const filter = this.snd.ctx.createBiquadFilter();
          const gain = this.snd.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1100, time);

          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.12, time + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.75);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.snd.bgmGain);
          osc.start(time);
          osc.stop(time + duration);
          osc.onended = () => { osc.disconnect(); filter.disconnect(); gain.disconnect(); };
        });
      }

      playPercussionVoice(time) {
        if (!this.snd.noiseBuffer) return;
        const src = this.snd.ctx.createBufferSource();
        src.buffer = this.snd.noiseBuffer;
        const bp = this.snd.ctx.createBiquadFilter();
        const gain = this.snd.ctx.createGain();

        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(1500, time);
        bp.Q.setValueAtTime(6.0, time);

        gain.gain.setValueAtTime(0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);

        src.connect(bp);
        bp.connect(gain);
        gain.connect(this.snd.bgmGain);
        src.start(time);
        src.stop(time + 0.04);
        src.onended = () => { src.disconnect(); bp.disconnect(); gain.disconnect(); };
      }
    }

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.compressor = null;
        this.isMuted = false;
        this.isUnlocked = false;
        this.noiseBuffer = null;
        this.sequencer = null;

        this.init = this.init.bind(this);
        this.unlock = this.unlock.bind(this);
        this.setMuted = this.setMuted.bind(this);
        this.isMutedState = this.isMutedState.bind(this);
        this.playSFX = this.playSFX.bind(this);
      }

      async init() {
        if (this.ctx) return true;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return false;
          this.ctx = new AudioCtx();

          // Master Limiter Compressor
          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.setValueAtTime(-4.0, this.ctx.currentTime);
          this.compressor.knee.setValueAtTime(8.0, this.ctx.currentTime);
          this.compressor.ratio.setValueAtTime(12.0, this.ctx.currentTime);
          this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
          this.compressor.release.setValueAtTime(0.15, this.ctx.currentTime);

          // Gains
          this.masterGain = this.ctx.createGain();
          const initialGain = this.isMuted ? 0.0 : 0.80;
          this.masterGain.gain.setValueAtTime(initialGain, this.ctx.currentTime);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.setValueAtTime(0.85, this.ctx.currentTime);

          this.bgmGain = this.ctx.createGain();
          this.bgmGain.gain.setValueAtTime(0.32, this.ctx.currentTime);

          this.sfxGain.connect(this.compressor);
          this.bgmGain.connect(this.compressor);
          this.compressor.connect(this.masterGain);
          this.masterGain.connect(this.ctx.destination);

          this.generateNoiseBuffer();
          this.sequencer = new BGMSequencer(this);
          this.setupUnlockListeners();
          return true;
        } catch (e) {
          console.warn('Web Audio initialization:', e);
          return false;
        }
      }

      setupUnlockListeners() {
        const unlockHandler = () => {
          this.unlock();
          ['pointerdown', 'touchstart', 'keydown', 'mousedown'].forEach(evt => {
            window.removeEventListener(evt, unlockHandler, { capture: true });
          });
        };
        ['pointerdown', 'touchstart', 'keydown', 'mousedown'].forEach(evt => {
          window.addEventListener(evt, unlockHandler, { capture: true, passive: true });
        });
      }

      async unlock() {
        if (!this.ctx) await this.init();
        if (!this.ctx) return false;

        if (this.ctx.state === 'suspended') {
          try {
            await this.ctx.resume();
          } catch (err) {}
        }

        try {
          const dummy = this.ctx.createBufferSource();
          dummy.buffer = this.ctx.createBuffer(1, 1, 22050);
          dummy.connect(this.ctx.destination);
          dummy.start(0);
          dummy.stop(0.001);
        } catch (_) {}

        this.isUnlocked = (this.ctx.state === 'running');
        return this.isUnlocked;
      }

      setMuted(muted) {
        this.isMuted = Boolean(muted);
        if (this.masterGain && this.ctx) {
          const now = this.ctx.currentTime;
          this.masterGain.gain.cancelScheduledValues(now);
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0.0 : 0.80, now, 0.025);
        }
      }

      isMutedState() {
        return this.isMuted;
      }

      generateNoiseBuffer() {
        const sampleRate = this.ctx.sampleRate || 44100;
        const length = sampleRate * 2.0;
        this.noiseBuffer = this.ctx.createBuffer(1, length, sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }

      // --- SFX RECIPES ---
      playCluck(type = 'short') {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        const carrier = this.ctx.createOscillator();
        const modulator = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        const voiceGain = this.ctx.createGain();

        carrier.type = 'triangle';
        modulator.type = 'sine';

        carrier.frequency.setValueAtTime(420, now);
        carrier.frequency.linearRampToValueAtTime(560, now + 0.025);
        carrier.frequency.exponentialRampToValueAtTime(240, now + 0.11);

        modulator.frequency.setValueAtTime(28, now);
        modGain.gain.setValueAtTime(95, now);
        modulator.connect(carrier.frequency);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(860, now);
        filter.Q.setValueAtTime(3.5, now);

        voiceGain.gain.setValueAtTime(0.001, now);
        voiceGain.gain.linearRampToValueAtTime(0.75, now + 0.008);
        voiceGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        carrier.connect(filter);
        filter.connect(voiceGain);
        voiceGain.connect(this.sfxGain);

        modulator.start(now);
        carrier.start(now);
        modulator.stop(now + 0.13);
        carrier.stop(now + 0.13);

        carrier.onended = () => {
          modulator.disconnect();
          carrier.disconnect();
          filter.disconnect();
          voiceGain.disconnect();
        };
      }

      playEggPop() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';

        osc.frequency.setValueAtTime(840, now);
        osc.frequency.exponentialRampToValueAtTime(130, now + 0.065);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.80, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.08);

        if (this.noiseBuffer) {
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          const clickGain = this.ctx.createGain();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1900, now);
          filter.Q.setValueAtTime(5.5, now);
          clickGain.gain.setValueAtTime(0.28, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
          src.connect(filter);
          filter.connect(clickGain);
          clickGain.connect(this.sfxGain);
          src.start(now);
          src.stop(now + 0.02);
        }

        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      }

      playCrack() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted || !this.noiseBuffer) return;
        const now = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2600, now);
        filter.Q.setValueAtTime(2.2, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.65, now + 0.002);
        gain.gain.setValueAtTime(0.45, now + 0.015);
        gain.gain.linearRampToValueAtTime(0.70, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.sfxGain);
        src.start(now);
        src.stop(now + 0.08);
        src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
      }

      playHatch() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        this.playCrack();

        const scheduleChirp = (startTime, startFreq, peakFreq, endFreq, peakGain) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';

          osc.frequency.setValueAtTime(startFreq, startTime);
          osc.frequency.linearRampToValueAtTime(peakFreq, startTime + 0.030);
          osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + 0.075);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.080);

          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(startTime);
          osc.stop(startTime + 0.085);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
        };

        scheduleChirp(now + 0.045, 1650, 2650, 2100, 0.48);
        scheduleChirp(now + 0.170, 1900, 2950, 2350, 0.52);
      }

      playMudSplash(intensity = 1.0) {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        const scale = Math.max(0.4, Math.min(1.6, intensity));

        if (this.noiseBuffer) {
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(3400 * scale, now);
          filter.frequency.exponentialRampToValueAtTime(450, now + 0.22);
          filter.Q.setValueAtTime(4.2, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.75 * scale, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.sfxGain);
          src.start(now);
          src.stop(now + 0.25);
          src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
        }

        const boomOsc = this.ctx.createOscillator();
        const boomGain = this.ctx.createGain();
        boomOsc.type = 'sine';
        boomOsc.frequency.setValueAtTime(170 * scale, now);
        boomOsc.frequency.exponentialRampToValueAtTime(36, now + 0.25);

        boomGain.gain.setValueAtTime(0.001, now);
        boomGain.gain.linearRampToValueAtTime(0.85 * scale, now + 0.004);
        boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.27);

        boomOsc.connect(boomGain);
        boomGain.connect(this.sfxGain);
        boomOsc.start(now);
        boomOsc.stop(now + 0.28);
        boomOsc.onended = () => { boomOsc.disconnect(); boomGain.disconnect(); };
      }

      playSeedChime() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        const partials = [
          { freq: 1760.0, gain: 0.50, decay: 0.18 },
          { freq: 3520.0, gain: 0.22, decay: 0.12 },
          { freq: 5280.0, gain: 0.08, decay: 0.08 }
        ];

        partials.forEach(p => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(p.freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(p.gain, now + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.001, now + p.decay);

          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now);
          osc.stop(now + p.decay + 0.01);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
        });
      }

      playVictoryFanfare() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        if (this.sequencer) this.sequencer.duckBGM(0.9);

        const arpeggio = [
          { freq: 523.25, time: 0.00, dur: 0.08 },
          { freq: 659.25, time: 0.08, dur: 0.08 },
          { freq: 783.99, time: 0.16, dur: 0.08 },
          { freq: 1046.50, time: 0.24, dur: 0.12 }
        ];
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51];

        const playBrassVoice = (freq, startTime, duration, peakGain) => {
          const osc1 = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(freq, startTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1800, startTime);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc1.connect(filter);
          filter.connect(gain);
          gain.connect(this.sfxGain);

          osc1.start(startTime);
          osc1.stop(startTime + duration + 0.02);
          osc1.onended = () => { osc1.disconnect(); filter.disconnect(); gain.disconnect(); };
        };

        arpeggio.forEach(n => playBrassVoice(n.freq, now + n.time, n.dur, 0.40));
        chord.forEach(f => playBrassVoice(f, now + 0.36, 0.75, 0.20));
      }

      playOverheatCrash() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        if (this.sequencer) this.sequencer.duckBGM(1.4);

        // Alarm Beeps
        [880, 1175, 880, 1175].forEach((freq, idx) => {
          const t = now + idx * 0.055;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.35, t + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t);
          osc.stop(t + 0.05);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
        });

        // Slide Trombone
        const slideStart = now + 0.24;
        const slideOsc = this.ctx.createOscillator();
        const slideGain = this.ctx.createGain();
        slideOsc.type = 'triangle';
        slideOsc.frequency.setValueAtTime(460, slideStart);
        slideOsc.frequency.exponentialRampToValueAtTime(95, slideStart + 0.65);

        slideGain.gain.setValueAtTime(0.001, slideStart);
        slideGain.gain.linearRampToValueAtTime(0.55, slideStart + 0.03);
        slideGain.gain.exponentialRampToValueAtTime(0.001, slideStart + 0.70);

        slideOsc.connect(slideGain);
        slideGain.connect(this.sfxGain);
        slideOsc.start(slideStart);
        slideOsc.stop(slideStart + 0.72);
        slideOsc.onended = () => { slideOsc.disconnect(); slideGain.disconnect(); };

        // Steam Hiss
        if (this.noiseBuffer) {
          const steamStart = now + 0.45;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(3200, steamStart);
          filter.Q.setValueAtTime(1.4, steamStart);

          gain.gain.setValueAtTime(0.001, steamStart);
          gain.gain.linearRampToValueAtTime(0.40, steamStart + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, steamStart + 0.75);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.sfxGain);
          src.start(steamStart);
          src.stop(steamStart + 0.80);
          src.onended = () => { src.disconnect(); filter.disconnect(); gain.disconnect(); };
        }
      }

      playClick() {
        if (!this.ctx || this.ctx.state !== 'running' || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.022);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.40, now + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.03);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      }

      playSFX(sfxName, options = {}) {
        switch (sfxName) {
          case 'cluck': this.playCluck(options.type || 'short'); break;
          case 'eggPop': this.playEggPop(); break;
          case 'crack': this.playCrack(); break;
          case 'hatch': this.playHatch(); break;
          case 'splash': this.playMudSplash(options.intensity || 1.0); break;
          case 'seedDrop': this.playSeedChime(); break;
          case 'fanfare': this.playVictoryFanfare(); break;
          case 'crash': this.playOverheatCrash(); break;
          case 'click': this.playClick(); break;
          default: break;
        }
      }
    }

    const soundEngine = new SoundEngine();

    // Telemetry Audio Spy
    window.__AUDIO_SPY__ = {
      events: [],
      clear: function() { this.events = []; },
      record: function(type, params = {}) {
        this.events.push({ type, timestamp: performance.now(), params });
        if (this.events.length > 500) this.events.shift();
      },
      isContextRunning: function() {
        return Boolean(soundEngine.ctx && soundEngine.ctx.state === 'running');
      }
    };

    window.__AUDIO_ENGINE__ = {
      init: async () => soundEngine.init(),
      unlock: async () => soundEngine.unlock(),
      setMuted: (isMuted) => {
        soundEngine.setMuted(isMuted);
        window.__AUDIO_SPY__.record('mute_toggle', { muted: isMuted });
      },
      isMuted: () => soundEngine.isMutedState(),
      playSFX: (sfxName, options = {}) => {
        window.__AUDIO_SPY__.record(sfxName, options);
        soundEngine.playSFX(sfxName, options);
      },
      startBGM: () => {
        soundEngine.unlock().then(() => {
          if (soundEngine.sequencer) {
            soundEngine.sequencer.start();
            window.__AUDIO_SPY__.record('bgm_start');
          }
        });
      },
      stopBGM: () => {
        if (soundEngine.sequencer) {
          soundEngine.sequencer.stop();
          window.__AUDIO_SPY__.record('bgm_stop');
        }
      },
      setBGMTempo: (bpm) => {
        if (soundEngine.sequencer) {
          soundEngine.sequencer.setTempo(bpm);
          window.__AUDIO_SPY__.record('bgm_tempo', { bpm });
        }
      }
    };

    // =========================================================================
    // SECTION 4: DISPLAY MANAGER (16:9 HIGH-DPI VIEWPORT & LETTERBOXING)
    // =========================================================================
    class DisplayManager {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: false });
        this.vWidth = 960;
        this.vHeight = 540;
        this.targetAspect = this.vWidth / this.vHeight;

        this._scale = 1.0;
        this._offsetX = 0;
        this._offsetY = 0;
        this._dpr = 1.0;
        this._windowWidth = window.innerWidth;
        this._windowHeight = window.innerHeight;
        this.letterboxColor = '#0f172a';

        this.resizeHandler = () => this.syncResize();
        window.addEventListener('resize', this.resizeHandler);
        window.addEventListener('orientationchange', this.resizeHandler);
        this.syncResize();
      }

      get scale() {
        this.checkDimensionChange();
        return this._scale;
      }
      set scale(v) { this._scale = v; }

      get offsetX() {
        this.checkDimensionChange();
        return this._offsetX;
      }
      set offsetX(v) { this._offsetX = v; }

      get offsetY() {
        this.checkDimensionChange();
        return this._offsetY;
      }
      set offsetY(v) { this._offsetY = v; }

      get dpr() {
        this.checkDimensionChange();
        return this._dpr;
      }
      set dpr(v) { this._dpr = v; }

      get windowWidth() {
        this.checkDimensionChange();
        return this._windowWidth;
      }
      set windowWidth(v) { this._windowWidth = v; }

      get windowHeight() {
        this.checkDimensionChange();
        return this._windowHeight;
      }
      set windowHeight(v) { this._windowHeight = v; }

      checkDimensionChange() {
        if (this._windowWidth !== window.innerWidth || this._windowHeight !== window.innerHeight) {
          this.syncResize();
        }
      }

      syncResize() {
        this._windowWidth = window.innerWidth;
        this._windowHeight = window.innerHeight;
        this._dpr = Math.min(window.devicePixelRatio || 1, 3);

        const windowAspect = this._windowWidth / Math.max(1, this._windowHeight);
        let displayWidth, displayHeight;

        if (windowAspect > this.targetAspect) {
          displayHeight = this._windowHeight;
          displayWidth = this._windowHeight * this.targetAspect;
        } else {
          displayWidth = this._windowWidth;
          displayHeight = this._windowWidth / this.targetAspect;
        }

        this._scale = displayWidth / this.vWidth;
        this._offsetX = (this._windowWidth - displayWidth) / 2;
        this._offsetY = (this._windowHeight - displayHeight) / 2;

        if (this.canvas) {
          this.canvas.width = Math.max(1, Math.floor(this._windowWidth * this._dpr));
          this.canvas.height = Math.max(1, Math.floor(this._windowHeight * this._dpr));
          this.canvas.style.width = `${this._windowWidth}px`;
          this.canvas.style.height = `${this._windowHeight}px`;
        }
      }

      resize() {
        this.syncResize();
      }

      beginFrame() {
        this.checkDimensionChange();
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this._dpr, this._dpr);

        ctx.fillStyle = this.letterboxColor;
        ctx.fillRect(0, 0, this._windowWidth, this._windowHeight);

        ctx.translate(this._offsetX, this._offsetY);
        ctx.scale(this._scale, this._scale);

        ctx.beginPath();
        ctx.rect(0, 0, this.vWidth, this.vHeight);
        ctx.clip();
      }

      endFrame() {
        this.ctx.restore();
      }

      screenToVirtual(screenX, screenY) {
        this.checkDimensionChange();
        const vx = (screenX - this._offsetX) / this._scale;
        const vy = (screenY - this._offsetY) / this._scale;
        const inside = vx >= 0 && vx <= this.vWidth && vy >= 0 && vy <= this.vHeight;
        return { x: vx, y: vy, inside };
      }

      virtualToScreen(vx, vy) {
        this.checkDimensionChange();
        return {
          screenX: vx * this._scale + this._offsetX,
          screenY: vy * this._scale + this._offsetY
        };
      }
    }

    // =========================================================================
    // SECTION 5: INPUT MANAGER (UNIFIED POINTER & KEYBOARD)
    // =========================================================================
    class InputManager {
      constructor(displayManager) {
        this.display = displayManager;
        this.pointers = new Map();
        this.keysDown = new Set();
        this.keysJustPressed = new Set();
        this.keysJustReleased = new Set();

        this.actionJustPressed = false;
        this.actionIsDown = false;
        this.actionJustReleased = false;
        this.primaryPointer = { x: 480, y: 270, isDown: false, inside: true };

        this._listeners = new Map();
        this._boundOnPointerDown = this._onPointerDown.bind(this);
        this._boundOnPointerMove = this._onPointerMove.bind(this);
        this._boundOnPointerUp = this._onPointerUp.bind(this);
        this._boundOnKeyDown = this._onKeyDown.bind(this);
        this._boundOnKeyUp = this._onKeyUp.bind(this);
        this.attach();
      }

      attach() {
        const canvas = this.display.canvas;
        canvas.addEventListener('pointerdown', this._boundOnPointerDown, { passive: false });
        window.addEventListener('pointermove', this._boundOnPointerMove, { passive: false });
        window.addEventListener('pointerup', this._boundOnPointerUp, { passive: false });
        window.addEventListener('pointercancel', this._boundOnPointerUp, { passive: false });
        window.addEventListener('keydown', this._boundOnKeyDown, { passive: false });
        window.addEventListener('keyup', this._boundOnKeyUp, { passive: false });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      }

      _unlockAudio() {
        if (window.__AUDIO_ENGINE__ && typeof window.__AUDIO_ENGINE__.unlock === 'function') {
          window.__AUDIO_ENGINE__.unlock();
        }
      }

      _onPointerDown(e) {
        if (typeof e.clientX !== 'number' || !isFinite(e.clientX) || typeof e.clientY !== 'number' || !isFinite(e.clientY)) {
          return;
        }
        if (e.cancelable && typeof e.preventDefault === 'function') e.preventDefault();
        this._unlockAudio();

        const vPos = this.display.screenToVirtual(e.clientX, e.clientY);
        if (!isFinite(vPos.x) || !isFinite(vPos.y)) return;
        const ptrId = e.pointerId !== undefined ? e.pointerId : 1;
        const pointerData = {
          id: ptrId,
          screenX: e.clientX,
          screenY: e.clientY,
          x: vPos.x,
          y: vPos.y,
          inside: vPos.inside,
          isDown: true,
          justPressed: true,
          justReleased: false
        };

        this.pointers.set(ptrId, pointerData);
        this.primaryPointer = { x: vPos.x, y: vPos.y, isDown: true, inside: vPos.inside };
        this.actionJustPressed = true;
        this.actionIsDown = true;
        this.emit('pointerdown', pointerData);
        this.emit('tap', vPos);
      }

      _onPointerMove(e) {
        const ptrId = e.pointerId !== undefined ? e.pointerId : 1;
        if (this.pointers.has(ptrId)) {
          const vPos = this.display.screenToVirtual(e.clientX, e.clientY);
          const p = this.pointers.get(ptrId);
          p.screenX = e.clientX;
          p.screenY = e.clientY;
          p.x = vPos.x;
          p.y = vPos.y;
          p.inside = vPos.inside;
          this.primaryPointer = { x: vPos.x, y: vPos.y, isDown: true, inside: vPos.inside };
          this.emit('pointermove', p);
        }
      }

      _onPointerUp(e) {
        const ptrId = e.pointerId !== undefined ? e.pointerId : 1;
        if (this.pointers.has(ptrId)) {
          const vPos = this.display.screenToVirtual(e.clientX, e.clientY);
          const p = this.pointers.get(ptrId);
          p.isDown = false;
          p.justReleased = true;
          this.emit('pointerup', p);
          this.pointers.delete(ptrId);
        } else {
          this.pointers.clear();
        }

        if (this.pointers.size === 0) {
          this.actionIsDown = this.keysDown.has('Space') || this.keysDown.has('Enter');
          this.actionJustReleased = true;
          this.primaryPointer.isDown = false;
        }
      }

      _onKeyDown(e) {
        this._unlockAudio();
        if (e.code === 'Space' || e.key === ' ' || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
          if (e.cancelable && typeof e.preventDefault === 'function') {
            e.preventDefault();
          }
        }

        if (!this.keysDown.has(e.code)) {
          this.keysJustPressed.add(e.code);
          this.keysDown.add(e.code);
          if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ') {
            this.actionJustPressed = true;
            this.actionIsDown = true;
          }
          this.emit('keydown', e.code);
        }
      }

      _onKeyUp(e) {
        this.keysDown.delete(e.code);
        this.keysJustReleased.add(e.code);
        if (e.code === 'Space' || e.code === 'Enter') {
          if (this.pointers.size === 0) {
            this.actionIsDown = false;
          }
          this.actionJustReleased = true;
        }
        this.emit('keyup', e.code);
      }

      postUpdate() {
        this.keysJustPressed.clear();
        this.keysJustReleased.clear();
        for (const p of this.pointers.values()) {
          p.justPressed = false;
          p.justReleased = false;
        }
        this.actionJustPressed = false;
        this.actionJustReleased = false;
      }

      isKeyDown(code) { return this.keysDown.has(code); }
      isKeyJustPressed(code) { return this.keysJustPressed.has(code); }
      isActionJustPressed() { return this.actionJustPressed; }

      on(name, cb) {
        if (!this._listeners.has(name)) this._listeners.set(name, []);
        this._listeners.get(name).push(cb);
      }

      emit(name, data) {
        if (!this._listeners.has(name)) return;
        for (const cb of this._listeners.get(name)) {
          try { cb(data); } catch (err) { console.error(err); }
        }
      }
    }

    // =========================================================================
    // SECTION 6: STORAGE MANAGER (LOCALSTORAGE & MEMORY FALLBACK)
    // =========================================================================
    class StorageManager {
      constructor(storageKey = 'hmc_game_data_v1') {
        this.storageKey = storageKey;
        this.data = this.getDefaults();
        this.load();
      }

      getDefaults() {
        return {
          version: 1,
          settings: { soundMuted: false, musicMuted: false, masterVolume: 0.85 },
          highScores: { eggLaying: 0, muddyPuddles: 0, chickMaze: 0, daddyPig: 0 },
          cumulativeStats: { totalEggsLaid: 0, totalChicksHatched: 0, totalPuddlesSplashed: 0, totalChicksRescued: 0, totalPlaySessions: 0 }
        };
      }

      load() {
        try {
          const serialized = localStorage.getItem(this.storageKey);
          if (serialized) {
            const parsed = JSON.parse(serialized);
            if (parsed && parsed.version === 1) {
              this.data = {
                ...this.getDefaults(),
                ...parsed,
                settings: { ...this.getDefaults().settings, ...(parsed.settings || {}) },
                highScores: { ...this.getDefaults().highScores, ...(parsed.highScores || {}) },
                cumulativeStats: { ...this.getDefaults().cumulativeStats, ...(parsed.cumulativeStats || {}) }
              };
              return;
            }
          }
        } catch (e) {
          console.warn('LocalStorage load fallback to memory:', e);
        }
        this.data = this.getDefaults();
      }

      save() {
        try {
          localStorage.setItem(this.storageKey, JSON.stringify(this.data));
        } catch (e) {
          console.warn('LocalStorage save fallback to memory:', e);
        }
      }

      getHighScore(modeKey) {
        return this.data.highScores[modeKey] || 0;
      }

      saveHighScore(modeKey, score) {
        if (score > (this.data.highScores[modeKey] || 0)) {
          this.data.highScores[modeKey] = score;
          this.save();
          return true;
        }
        return false;
      }

      isMuted() {
        return Boolean(this.data.settings.soundMuted);
      }

      setMuted(muted) {
        this.data.settings.soundMuted = Boolean(muted);
        this.save();
      }
    }

    /**
     * 2. MODE 1: HAPPY MRS CHICKEN (CLASSIC EGG LAYING)
     */
    class EggLayingScene extends Scene {
      constructor(game) {
        super(game);
        this.time = 0;
        this.eggs = [];
        this.chicks = [];
        this.particles = new ParticleEngine(150);
        this.chicken = { x: 480, y: 150, squash: 1.0, squawk: 0, flap: 0 };
        this.lastLayTime = 0;
      }

      enter() {
        this.score = 0;
        this.eggs = [];
        this.chicks = [];
        this.particles.clear();
        this.time = 0;
      }

      layEgg() {
        const now = performance.now();
        if (now - this.lastLayTime < 65) return;
        this.lastLayTime = now;

        // Egg entity
        this.eggs.push({
          x: this.chicken.x + (Math.random() * 20 - 10),
          y: this.chicken.y + 25,
          vx: (Math.random() - 0.5) * 80,
          vy: 60 + Math.random() * 30,
          rotation: Math.random() * 0.4 - 0.2,
          vRot: (Math.random() - 0.5) * 0.1,
          state: 'FALLING',
          timer: 0,
          crackStage: 0
        });

        this.score++;
        this.chicken.squash = 0.75;
        this.chicken.squawk = 1.0;

        window.__AUDIO_ENGINE__.playSFX('cluck');
        window.__AUDIO_ENGINE__.playSFX('eggPop');
        this.particles.spawnFeathers(this.chicken.x, this.chicken.y, 2);
      }

      update(dt, input) {
        this.time += dt;

        // Header back button tap
        const ptr = input.primaryPointer;
        if (ptr && ptr.isDown && input.isActionJustPressed() && ptr.x <= 90 && ptr.y <= 60) {
          this.game.storage.saveHighScore('eggLaying', this.score);
          this.game.sceneManager.changeScene('MENU');
          return;
        }

        // Lay egg on Space or canvas tap
        if (input.isActionJustPressed()) {
          this.layEgg();
        }

        // Chicken animation recovery
        this.chicken.squash += (1.0 - this.chicken.squash) * (dt * 15);
        this.chicken.squawk += (0 - this.chicken.squawk) * (dt * 12);
        this.chicken.flap = Math.sin(this.time * 6) * 0.15;
        this.chicken.y = 150 + Math.sin(this.time * 3.2) * 6;

        // Egg physics & stacking
        const groundY = 460;
        for (let i = 0; i < this.eggs.length; i++) {
          const egg = this.eggs[i];

          if (egg.state === 'FALLING') {
            egg.vy += 980 * dt;
            egg.x += egg.vx * dt;
            egg.y += egg.vy * dt;
            egg.rotation += egg.vRot;

            if (egg.y >= groundY) {
              egg.y = groundY;
              egg.vy = -egg.vy * 0.38;
              egg.vx *= 0.94;
              if (Math.abs(egg.vy) < 30) {
                egg.vy = 0;
                egg.state = 'INCUBATING';
              }
            }
          } else if (egg.state === 'INCUBATING') {
            egg.timer += dt;
            if (egg.timer >= 2.5 || this.eggs.length > 10) {
              egg.state = 'CRACK_1';
              egg.crackStage = 1;
              egg.timer = 0;
              window.__AUDIO_ENGINE__.playSFX('crack');
            }
          } else if (egg.state === 'CRACK_1') {
            egg.timer += dt;
            egg.rotation = Math.sin(this.time * 25) * 0.15;
            if (egg.timer >= 0.6) {
              egg.state = 'CRACK_2';
              egg.crackStage = 3;
              egg.timer = 0;
              window.__AUDIO_ENGINE__.playSFX('crack');
            }
          } else if (egg.state === 'CRACK_2') {
            egg.timer += dt;
            if (egg.timer >= 0.5) {
              egg.state = 'HATCH_BURST';
              this.particles.spawnEggCrack(egg.x, egg.y, 8);
              window.__AUDIO_ENGINE__.playSFX('hatch');

              // Spawn scampering chick
              this.chicks.push({
                x: egg.x,
                y: egg.y - 5,
                vx: Math.random() > 0.5 ? 120 : -120,
                walkCycle: 0,
                facingLeft: false
              });
            }
          }
        }

        // Egg-egg stacking separation
        for (let i = 0; i < this.eggs.length; i++) {
          for (let j = i + 1; j < this.eggs.length; j++) {
            const e1 = this.eggs[i];
            const e2 = this.eggs[j];
            const dx = e1.x - e2.x;
            const dy = e1.y - e2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0 && dist < 28) {
              const overlap = 28 - dist;
              const nx = dx / dist;
              const ny = dy / dist;
              e1.x += nx * overlap * 0.5;
              e1.y += ny * overlap * 0.5;
              e2.x -= nx * overlap * 0.5;
              e2.y -= ny * overlap * 0.5;
            }
          }
        }

        // Filter out hatched eggs
        this.eggs = this.eggs.filter(e => e.state !== 'HATCH_BURST');

        // Update scampering chicks
        for (let i = this.chicks.length - 1; i >= 0; i--) {
          const chick = this.chicks[i];
          chick.x += chick.vx * dt;
          chick.walkCycle += dt * 14;
          chick.facingLeft = chick.vx < 0;

          if (chick.x < -50 || chick.x > 1010) {
            this.chicks.splice(i, 1);
            this.game.storage.data.cumulativeStats.totalChicksHatched++;
          }
        }

        this.particles.update(dt);
      }

      render(ctx, alpha, display) {
        drawLandscapeSkyHills(ctx, 960, 540, this.time);

        // Nest Cradle
        drawHayNest(ctx, 480, 480, 260, 90);

        // Eggs
        for (const egg of this.eggs) {
          drawEgg(ctx, egg.x, egg.y, 1.0, egg.rotation, egg.crackStage);
        }

        // Chicks
        for (const chick of this.chicks) {
          drawBabyChick(ctx, chick.x, chick.y, 1.0, { walkCycle: chick.walkCycle, facingLeft: chick.facingLeft });
        }

        // Mrs Chicken
        drawMrsChicken(ctx, this.chicken.x, this.chicken.y, 1.15, {
          squash: this.chicken.squash,
          squawk: this.chicken.squawk,
          flap: this.chicken.flap
        });

        this.particles.render(ctx);

        // Top HUD
        ctx.save();
        // Back Button
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.roundRect(20, 15, 70, 36, 10);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⬅ Back', 55, 38);

        // Score Badge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.roundRect(400, 15, 160, 40, 15);
        ctx.fill();
        ctx.fillStyle = '#FFD54F';
        ctx.font = 'bold 22px "Comic Sans MS", sans-serif';
        ctx.fillText(`Eggs: ${this.score}`, 480, 42);
        ctx.restore();
      }

      getEntities() {
        return {
          eggs: this.eggs.map(e => ({ x: e.x, y: e.y, state: e.state })),
          chicks: this.chicks.map(c => ({ x: c.x, y: c.y, state: 'SCAMPERING' })),
          puddles: [],
          seeds: [],
          particles: this.particles.active
        };
      }
    }

    /**
     * 3. MODE 2: MUDDY PUDDLES
     */
    class MuddyPuddlesScene extends Scene {
      constructor(game) {
        super(game);
        this.time = 0;
        this.timer = 60.0;
        this.puddles = [];
        this.particles = new ParticleEngine(150);
        this.peppa = { x: 480, y: 410, vx: 0, jumpY: 0, isJumping: false, jumpV: 0, squish: 1.0 };
        this.multiplier = 1;
        this.spawnTimer = 0;
      }

      enter() {
        this.score = 0;
        this.timer = 60.0;
        this.multiplier = 1;
        this.puddles = [];
        this.particles.clear();
        this.peppa = { x: 480, y: 410, vx: 0, jumpY: 0, isJumping: false, jumpV: 0, squish: 1.0 };
        this.spawnPuddle();
      }

      spawnPuddle() {
        if (this.puddles.length >= 5) return;
        const isGolden = Math.random() < 0.15;
        this.puddles.push({
          x: 150 + Math.random() * 660,
          y: 360 + Math.random() * 90,
          rx: isGolden ? 50 : 44 + Math.random() * 16,
          ry: isGolden ? 25 : 22 + Math.random() * 8,
          type: isGolden ? 'GOLDEN' : 'STANDARD',
          lifetime: 5.0,
          ripplePhase: 0
        });
      }

      jump() {
        if (this.peppa.isJumping) return;
        this.peppa.isJumping = true;
        this.peppa.jumpV = -460;
        this.peppa.squish = 1.25;
      }

      update(dt, input) {
        this.time += dt;
        if (this.timer > 0) {
          this.timer = Math.max(0, this.timer - dt);
        }

        // Back button
        const ptr = input.primaryPointer;
        if (ptr && ptr.isDown && input.isActionJustPressed() && ptr.x <= 90 && ptr.y <= 60) {
          this.game.storage.saveHighScore('muddyPuddles', this.score);
          this.game.sceneManager.changeScene('MENU');
          return;
        }

        // Spawner
        this.spawnTimer += dt;
        if (this.spawnTimer >= 1.5) {
          this.spawnTimer = 0;
          this.spawnPuddle();
        }

        // Controls
        if (input.isKeyDown('ArrowLeft') || input.isKeyDown('KeyA')) {
          this.peppa.vx = -240;
        } else if (input.isKeyDown('ArrowRight') || input.isKeyDown('KeyD')) {
          this.peppa.vx = 240;
        } else {
          this.peppa.vx = 0;
        }

        if (input.isActionJustPressed()) {
          const p = input.primaryPointer;
          if (p.inside && p.y > 100) {
            this.peppa.x = p.x;
            this.jump();
          } else {
            this.jump();
          }
        }

        // Peppa jump physics
        this.peppa.x = Math.max(80, Math.min(880, this.peppa.x + this.peppa.vx * dt));
        if (this.peppa.isJumping) {
          this.peppa.jumpV += 1400 * dt;
          this.peppa.jumpY += this.peppa.jumpV * dt;

          if (this.peppa.jumpY >= 0) {
            this.peppa.jumpY = 0;
            this.peppa.isJumping = false;
            this.peppa.squish = 0.7;

            // Check collision with puddles
            let hit = false;
            for (let i = this.puddles.length - 1; i >= 0; i--) {
              const pud = this.puddles[i];
              const dx = (this.peppa.x - pud.x) / pud.rx;
              const dy = (410 - pud.y) / pud.ry;
              const dNorm = Math.sqrt(dx * dx + dy * dy);

              if (dNorm <= 1.0) {
                hit = true;
                pud.ripplePhase = 0.01;
                const pts = pud.type === 'GOLDEN' ? 100 : 25;
                const centerBonus = dNorm <= 0.4 ? 2 : 1;
                this.score += pts * centerBonus * this.multiplier;
                this.multiplier = Math.min(5, this.multiplier + 1);

                if (pud.type === 'GOLDEN') {
                  this.timer = Math.min(60, this.timer + 3.0);
                  this.particles.spawnSparkles(pud.x, pud.y, 10);
                }

                this.particles.spawnMudSplash(pud.x, pud.y, 20, pud.type === 'GOLDEN');
                this.particles.spawnScorePopup(pud.x, pud.y - 30, `+${pts * centerBonus * this.multiplier}`);
                window.__AUDIO_ENGINE__.playSFX('splash');
                this.puddles.splice(i, 1);
                break;
              }
            }

            if (!hit) {
              this.multiplier = 1;
            }
          }
        }

        this.peppa.squish += (1.0 - this.peppa.squish) * (dt * 12);

        // Update puddles
        for (let i = this.puddles.length - 1; i >= 0; i--) {
          const pud = this.puddles[i];
          pud.lifetime -= dt;
          if (pud.ripplePhase > 0) pud.ripplePhase += dt * 2.0;
          if (pud.lifetime <= 0) this.puddles.splice(i, 1);
        }

        this.particles.update(dt);
      }

      render(ctx, alpha, display) {
        drawLandscapeSkyHills(ctx, 960, 540, this.time);

        // Puddles
        for (const pud of this.puddles) {
          drawMuddyPuddle(ctx, pud.x, pud.y, pud.rx, pud.ry, { type: pud.type, ripplePhase: pud.ripplePhase });
        }

        // Peppa Pig
        drawPeppaPig(ctx, this.peppa.x, this.peppa.y, 1.0, {
          jumpY: this.peppa.jumpY,
          squish: this.peppa.squish,
          armWave: this.time * 8
        });

        this.particles.render(ctx);

        // HUD
        ctx.save();
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.roundRect(20, 15, 70, 36, 10);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⬅ Back', 55, 38);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.roundRect(360, 15, 240, 40, 15);
        ctx.fill();
        ctx.fillStyle = '#FFD54F';
        ctx.font = 'bold 20px "Comic Sans MS", sans-serif';
        ctx.fillText(`Score: ${this.score}  |  ⏱ ${this.timer.toFixed(1)}s`, 480, 42);
        ctx.restore();
      }

      getEntities() {
        return {
          eggs: [],
          chicks: [],
          puddles: this.puddles.map(p => ({ x: p.x, y: p.y, type: p.type, size: p.rx })),
          seeds: [],
          particles: this.particles.active
        };
      }

      getModeState() {
        return { timer: this.timer, feverMeter: 0, multiplier: this.multiplier, coopSavedCount: 0, isOverheating: false };
      }
    }

    /**
     * 4. MODE 3: CHICK MAZE / SORTING
     */
    class ChickMazeScene extends Scene {
      constructor(game) {
        super(game);
        this.time = 0;
        this.chicks = [];
        this.seeds = [];
        this.coopSavedCount = 0;
        this.particles = new ParticleEngine(150);
        this.fences = [
          { minX: 250, minY: 150, maxX: 270, maxY: 380 },
          { minX: 520, minY: 200, maxX: 540, maxY: 480 }
        ];
      }

      enter() {
        this.score = 0;
        this.coopSavedCount = 0;
        this.seeds = [];
        this.particles.clear();
        this.time = 0;
        this.chicks = [];

        for (let i = 0; i < 5; i++) {
          this.chicks.push({
            x: 100 + Math.random() * 120,
            y: 180 + Math.random() * 260,
            vx: (Math.random() - 0.5) * 35,
            vy: (Math.random() - 0.5) * 35,
            walkCycle: 0,
            state: 'WANDERING'
          });
        }
      }

      dropSeed(x, y) {
        if (this.seeds.length >= 5) this.seeds.shift();
        this.seeds.push({ x, y, remaining: 1 });
        window.__AUDIO_ENGINE__.playSFX('seedDrop');
      }

      update(dt, input) {
        this.time += dt;

        // Back button
        const ptr = input.primaryPointer;
        if (ptr && ptr.isDown && input.isActionJustPressed() && ptr.x <= 90 && ptr.y <= 60) {
          this.game.storage.saveHighScore('chickMaze', this.coopSavedCount);
          this.game.sceneManager.changeScene('MENU');
          return;
        }

        // Tap to drop seed
        if (input.isActionJustPressed()) {
          const p = input.primaryPointer;
          if (p.inside && p.y > 80) {
            this.dropSeed(p.x, p.y);
          }
        }

        // Update chicks (Boids & Seed Attraction)
        const coopDoor = { x: 810, y: 160, r: 45 };

        for (let i = this.chicks.length - 1; i >= 0; i--) {
          const chick = this.chicks[i];

          // 1. Seed attraction
          let targetSeed = null;
          let minSeedDist = 180;
          for (const s of this.seeds) {
            const dx = s.x - chick.x;
            const dy = s.y - chick.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minSeedDist) {
              minSeedDist = dist;
              targetSeed = s;
            }
          }

          if (targetSeed) {
            const dx = targetSeed.x - chick.x;
            const dy = targetSeed.y - chick.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            chick.vx += (dx / dist) * 75 * dt;
            chick.vy += (dy / dist) * 75 * dt;

            // Eat seed
            if (dist < 14) {
              const sIdx = this.seeds.indexOf(targetSeed);
              if (sIdx !== -1) {
                this.seeds.splice(sIdx, 1);
                this.particles.spawnSparkles(targetSeed.x, targetSeed.y, 4);
              }
            }
          } else {
            // Wander
            chick.vx += (Math.random() - 0.5) * 40 * dt;
            chick.vy += (Math.random() - 0.5) * 40 * dt;
          }

          // Speed clamp
          const speed = Math.sqrt(chick.vx * chick.vx + chick.vy * chick.vy);
          if (speed > 70) {
            chick.vx = (chick.vx / speed) * 70;
            chick.vy = (chick.vy / speed) * 70;
          }

          chick.x += chick.vx * dt;
          chick.y += chick.vy * dt;
          chick.walkCycle += dt * 10;

          // Boundary & Fence collision
          chick.x = Math.max(60, Math.min(900, chick.x));
          chick.y = Math.max(120, Math.min(500, chick.y));

          // Check coop entry
          const cdx = chick.x - coopDoor.x;
          const cdy = chick.y - coopDoor.y;
          if (cdx * cdx + cdy * cdy <= coopDoor.r * coopDoor.r) {
            this.coopSavedCount++;
            this.score += 100;
            this.particles.spawnSparkles(coopDoor.x, coopDoor.y, 12);
            window.__AUDIO_ENGINE__.playSFX('fanfare');
            this.chicks.splice(i, 1);

            if (this.chicks.length === 0) {
              this.enter();
            }
          }
        }

        this.particles.update(dt);
      }

      render(ctx, alpha, display) {
        ctx.fillStyle = '#81C784';
        ctx.fillRect(0, 0, 960, 540);

        // Fences
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#90A4AE';
        ctx.lineWidth = 3;
        for (const f of this.fences) {
          ctx.fillRect(f.minX, f.minY, f.maxX - f.minX, f.maxY - f.minY);
          ctx.strokeRect(f.minX, f.minY, f.maxX - f.minX, f.maxY - f.minY);
        }

        // Hen Coop in Top-Right
        drawHenCoop(ctx, 810, 160, 200, 160);

        // Seeds
        for (const s of this.seeds) {
          ctx.fillStyle = PALETTE.SEED_CORN;
          ctx.strokeStyle = PALETTE.SEED_OUTLINE;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(s.x, s.y, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // Chicks
        for (const chick of this.chicks) {
          drawBabyChick(ctx, chick.x, chick.y, 1.0, { walkCycle: chick.walkCycle, facingLeft: chick.vx < 0 });
        }

        this.particles.render(ctx);

        // HUD
        ctx.save();
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.roundRect(20, 15, 70, 36, 10);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⬅ Back', 55, 38);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.roundRect(380, 15, 200, 40, 15);
        ctx.fill();
        ctx.fillStyle = '#FFD54F';
        ctx.font = 'bold 20px "Comic Sans MS", sans-serif';
        ctx.fillText(`Saved: ${this.coopSavedCount}`, 480, 42);
        ctx.restore();
      }

      getEntities() {
        return {
          eggs: [],
          chicks: this.chicks.map(c => ({ x: c.x, y: c.y, state: c.state })),
          puddles: [],
          seeds: this.seeds.map(s => ({ x: s.x, y: s.y, remaining: s.remaining })),
          particles: this.particles.active
        };
      }

      getModeState() {
        return { timer: 0, feverMeter: 0, multiplier: 1, coopSavedCount: this.coopSavedCount, isOverheating: false };
      }
    }

    /**
     * 5. MODE 4: DADDY PIG CHALLENGE
     */
    class DaddyPigScene extends Scene {
      constructor(game) {
        super(game);
        this.time = 0;
        this.fever = 0;
        this.timer = 20.0;
        this.multiplier = 1;
        this.particles = new ParticleEngine(150);
        this.isOverheating = false;
      }

      enter() {
        this.score = 0;
        this.fever = 0;
        this.timer = 20.0;
        this.multiplier = 1;
        this.isOverheating = false;
        this.particles.clear();
      }

      tap() {
        if (this.isOverheating) return;
        this.fever = Math.min(100, this.fever + 4.5);
        this.multiplier = this.fever >= 95 ? 10 : (this.fever >= 70 ? 5 : (this.fever >= 40 ? 2 : 1));
        this.score += 10 * this.multiplier;
        this.timer = Math.min(25.0, this.timer + 0.18);

        window.__AUDIO_ENGINE__.playSFX('cluck');
        window.__AUDIO_ENGINE__.playSFX('eggPop');

        if (this.fever >= 65) {
          this.particles.spawnSteam(740, 240);
        }
        if (this.fever >= 95) {
          this.particles.spawnSparkles(740, 260, 6);
        }

        if (this.fever >= 100 && !this.isOverheating) {
          this.isOverheating = true;
          window.__AUDIO_ENGINE__.playSFX('crash');
          this.game.storage.saveHighScore('daddyPig', this.score);
        }
      }

      update(dt, input) {
        this.time += dt;
        if (!this.isOverheating && this.timer > 0) {
          this.timer = Math.max(0, this.timer - dt);
          const decayRate = 6.5 + 0.05 * Math.sqrt(this.score);
          this.fever = Math.max(0, this.fever - decayRate * dt);
          this.multiplier = this.fever >= 95 ? 10 : (this.fever >= 70 ? 5 : (this.fever >= 40 ? 2 : 1));
        }

        // Back button
        const ptr = input.primaryPointer;
        if (ptr && ptr.isDown && input.isActionJustPressed() && ptr.x <= 90 && ptr.y <= 60) {
          this.game.storage.saveHighScore('daddyPig', this.score);
          this.game.sceneManager.changeScene('MENU');
          return;
        }

        if (input.isActionJustPressed()) {
          this.tap();
        }

        this.particles.update(dt);
      }

      render(ctx, alpha, display) {
        drawLandscapeSkyHills(ctx, 960, 540, this.time);

        // Mrs Chicken on Left
        drawMrsChicken(ctx, 280, 320, 1.2, { squash: 1.0 + Math.sin(this.time * 10) * 0.1, flap: Math.sin(this.time * 12) * 0.3 });

        // Daddy Pig & Desk on Right
        const panicStage = this.isOverheating ? 3 : (this.fever >= 65 ? 2 : (this.fever >= 30 ? 1 : 0));
        drawDaddyPig(ctx, 740, 320, 1.25, { panicStage, overheatProgress: this.fever / 100, time: this.time });

        this.particles.render(ctx);

        // Overheat BSOD Cutscene
        if (this.isOverheating) {
          ctx.save();
          ctx.fillStyle = 'rgba(13, 71, 161, 0.85)';
          ctx.fillRect(150, 100, 660, 340);
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 4;
          ctx.strokeRect(150, 100, 660, 340);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 32px "Comic Sans MS", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💻 COMPUTER OVERHEAT!', 480, 180);
          ctx.font = '20px "Comic Sans MS", sans-serif';
          ctx.fillText('Daddy Pig: "I think the computer couldn\'t handle my skills!"', 480, 240);
          ctx.font = 'bold 26px "Comic Sans MS", sans-serif';
          ctx.fillStyle = '#FFD54F';
          ctx.fillText(`Final Score: ${this.score}`, 480, 300);
          ctx.restore();
        }

        // HUD
        ctx.save();
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.roundRect(20, 15, 70, 36, 10);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⬅ Back', 55, 38);

        // Fever Gauge Bar
        ctx.fillStyle = '#37474F';
        ctx.beginPath();
        ctx.roundRect(300, 15, 360, 30, 10);
        ctx.fill();

        ctx.fillStyle = this.fever >= 95 ? '#E040FB' : (this.fever >= 70 ? '#FFD600' : '#00E676');
        ctx.beginPath();
        ctx.roundRect(304, 19, (352 * (this.fever / 100)), 22, 8);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
        ctx.fillText(`Fever: ${this.fever.toFixed(0)}% (x${this.multiplier})  |  Score: ${this.score}`, 480, 36);
        ctx.restore();
      }

      getEntities() {
        return { eggs: [], chicks: [], puddles: [], seeds: [], particles: this.particles.active };
      }

      getModeState() {
        return { timer: this.timer, feverMeter: this.fever, multiplier: this.multiplier, coopSavedCount: 0, isOverheating: this.isOverheating };
      }
    }

    // =========================================================================
    // SECTION 8: SCENE MANAGER & ROUTER
    // =========================================================================
    class SceneManager {
      constructor(game) {
        this.game = game;
        this.scenes = new Map();
        this.currentSceneName = 'MENU';
        this.activeScene = null;
      }

      register(name, sceneInstance) {
        this.scenes.set(name, sceneInstance);
      }

      changeScene(name, params = {}) {
        if (!this.scenes.has(name)) return;
        if (this.activeScene && typeof this.activeScene.exit === 'function') {
          this.activeScene.exit();
        }
        if (this.game && this.game.gameLoop) {
          this.game.gameLoop.isPaused = false;
        }
        this.currentSceneName = name;
        this.activeScene = this.scenes.get(name);
        if (this.activeScene && typeof this.activeScene.enter === 'function') {
          this.activeScene.enter(params);
        }
      }

      switchScene(name, params = {}) {
        this.changeScene(name, params);
      }

      update(dt, input) {
        if (this.activeScene) {
          this.activeScene.update(dt, input);
        }
      }

      render(ctx, alpha, display) {
        if (this.activeScene) {
          this.activeScene.render(ctx, alpha, display);
        }
      }
    }

    // =========================================================================
    // SECTION 9: 60 FPS FIXED TIMESTEP ACCUMULATOR GAME LOOP
    // =========================================================================
    class GameLoop {
      constructor(updateFn, renderFn) {
        this.updateFn = updateFn;
        this.renderFn = renderFn;
        this.fixedStep = 1 / 60;
        this.maxFrameTime = 0.100;
        this.isRunning = false;
        this.isPaused = false;
        this.lastTime = 0;
        this.accumulator = 0;
        this.rafId = null;

        this.fpsMonitor = {
          currentFPS: 60,
          avgFPS: 60,
          averageFps: 60,
          minFps: 60,
          droppedFrames: 0,
          history: new Array(60).fill(16.67)
        };
        this._historyIndex = 0;
        this._frameCount = 0;
        this._fpsTimer = 0;
        this._tick = this._tick.bind(this);
      }

      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.isPaused = false;
        this.lastTime = performance.now() / 1000;
        this.accumulator = 0;
        this.rafId = requestAnimationFrame(this._tick);
      }

      stop() {
        this.isRunning = false;
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
      }

      step(dt = this.fixedStep) {
        this.updateFn(dt);
        this.renderFn(1.0);
      }

      _tick(timestampMs) {
        if (!this.isRunning) return;

        const currentTime = timestampMs / 1000;
        const rawDt = Math.max(0, currentTime - this.lastTime);
        this.lastTime = currentTime;

        const frameMs = rawDt * 1000;
        this.fpsMonitor.history[this._historyIndex] = frameMs;
        this._historyIndex = (this._historyIndex + 1) % 60;

        if (frameMs > 33.33) this.fpsMonitor.droppedFrames++;

        this._frameCount++;
        this._fpsTimer += rawDt;
        if (this._fpsTimer >= 0.5) {
          this.fpsMonitor.currentFPS = Math.round(1 / Math.max(0.001, rawDt));
          this.fpsMonitor.avgFPS = Math.round((this._frameCount / this._fpsTimer) * 10) / 10;
          this.fpsMonitor.averageFps = this.fpsMonitor.avgFPS;
          this._frameCount = 0;
          this._fpsTimer = 0;
        }

        if (!this.isPaused) {
          const clampedDt = Math.min(rawDt, this.maxFrameTime);
          this.accumulator += clampedDt;
          let steps = 0;
          while (this.accumulator >= this.fixedStep && steps < 10) {
            this.updateFn(this.fixedStep, false);
            this.accumulator -= this.fixedStep;
            steps++;
          }
          if (this.accumulator >= this.fixedStep) this.accumulator = 0;
        } else {
          this.updateFn(0, true);
        }

        const alpha = this.isPaused ? 1.0 : this.accumulator / this.fixedStep;
        this.renderFn(alpha);

        this.rafId = requestAnimationFrame(this._tick);
      }
    }

    // =========================================================================
    // SECTION 10: MASTER GAME ENGINE ASSEMBLY & INTROSPECTION HOOKS
    // =========================================================================
    class GameEngine {
      constructor(canvasId = 'gameCanvas') {
        this.canvas = document.getElementById(canvasId);
        this.display = new DisplayManager(this.canvas);
        this.storage = new StorageManager('hmc_game_data_v1');
        this.input = new InputManager(this.display);
        this.sceneManager = new SceneManager(this);

        this.sceneManager.register('MENU', new MenuScene(this));
        this.sceneManager.register('EGG_LAYING', new EggLayingScene(this));
        this.sceneManager.register('MUDDY_PUDDLES', new MuddyPuddlesScene(this));
        this.sceneManager.register('CHICK_MAZE', new ChickMazeScene(this));
        this.sceneManager.register('DADDY_PIG', new DaddyPigScene(this));
        this.sceneManager.changeScene('MENU');

        this.gameLoop = new GameLoop(
          (dt, isPaused) => this.update(dt, isPaused),
          (alpha) => this.render(alpha)
        );

        this.setupIntrospectionHooks();
      }

      init() {
        this.display.syncResize();
        this.gameLoop.start();
      }

      update(dt, isPaused = false) {
        if (this.input.isKeyJustPressed('KeyM')) {
          const newMute = !this.storage.isMuted();
          this.storage.setMuted(newMute);
          window.__AUDIO_ENGINE__.setMuted(newMute);
        }

        if (this.input.isKeyJustPressed('Escape') || this.input.isKeyJustPressed('KeyP')) {
          if (this.sceneManager.currentSceneName !== 'MENU') {
            this.gameLoop.isPaused = !this.gameLoop.isPaused;
          }
        }

        if (!isPaused) {
          this.sceneManager.update(dt, this.input);
        }
        this.input.postUpdate();
      }

      render(alpha) {
        this.display.beginFrame();
        this.sceneManager.render(this.display.ctx, alpha, this.display);
        this.display.endFrame();
      }

      setupIntrospectionHooks() {
        const self = this;
        window.__GAME_STATE__ = {
          get currentScene() { return self.sceneManager.currentSceneName; },
          set currentScene(v) { self.sceneManager.changeScene(v); },
          get currentMode() { return self.sceneManager.currentSceneName; },
          set currentMode(v) { self.sceneManager.changeScene(v); },
          get score() {
            const active = self.sceneManager.activeScene;
            return (active && typeof active.score === 'number') ? active.score : 0;
          },
          set score(v) {
            const active = self.sceneManager.activeScene;
            if (active) active.score = v;
          },
          get highScores() { return self.storage.data.highScores; },
          get isPaused() { return self.gameLoop.isPaused; },
          set isPaused(v) { self.gameLoop.isPaused = Boolean(v); },
          get isAudioMuted() { return self.storage.isMuted(); },
          set isAudioMuted(v) {
            self.storage.setMuted(v);
            window.__AUDIO_ENGINE__.setMuted(v);
          },
          get audioMuted() { return self.storage.isMuted(); },
          set audioMuted(v) {
            self.storage.setMuted(v);
            window.__AUDIO_ENGINE__.setMuted(v);
          },
          get entities() {
            const active = self.sceneManager.activeScene;
            return active && active.getEntities ? active.getEntities() : { eggs: [], chicks: [], puddles: [], seeds: [], particles: [] };
          },
          get modeState() {
            const active = self.sceneManager.activeScene;
            return active && active.getModeState ? active.getModeState() : { timer: 0, feverMeter: 0, multiplier: 1, coopSavedCount: 0, isOverheating: false };
          }
        };

        Object.defineProperty(window, '__FPS_MONITOR__', {
          get: () => ({
            currentFPS: self.gameLoop.fpsMonitor.currentFPS,
            avgFPS: self.gameLoop.fpsMonitor.avgFPS,
            averageFps: self.gameLoop.fpsMonitor.avgFPS,
            minFps: self.gameLoop.fpsMonitor.minFps,
            droppedFrames: self.gameLoop.fpsMonitor.droppedFrames,
            history: [...self.gameLoop.fpsMonitor.history]
          }),
          configurable: true,
          enumerable: true
        });

        const audioBtn = document.getElementById('audio-toggle-btn');
        if (audioBtn) {
          audioBtn.addEventListener('click', () => {
            const newMute = !self.storage.isMuted();
            self.storage.setMuted(newMute);
            window.__AUDIO_ENGINE__.setMuted(newMute);
          });
        }

        window.__GAME_ENGINE__ = self;
        window.__SCENE_MANAGER__ = self.sceneManager;
        window.__DISPLAY_MANAGER__ = self.display;
      }
    }

    // Launch Engine on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      const engine = new GameEngine('gameCanvas');
      engine.init();
    });
  </script>
