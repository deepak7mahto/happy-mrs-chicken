  <script>
    (function() {
      function polyfill(proto) {
        if (!proto || typeof proto.roundRect === 'function') return;
        proto.roundRect = function(x, y, w, h, radii) {
          if (w === 0 || h === 0) { this.rect(x, y, w, h); return this; }
          var rx = x, ry = y, rw = w, rh = h;
          if (rw < 0) { rx += rw; rw = Math.abs(rw); }
          if (rh < 0) { ry += rh; rh = Math.abs(rh); }
          var maxR = Math.min(rw / 2, rh / 2);
          var tl = 0, tr = 0, br = 0, bl = 0;
          if (typeof radii === 'number') {
            tl = tr = br = bl = Math.max(0, Math.min(radii, maxR));
          } else if (Array.isArray(radii)) {
            var getR = function(v) { return typeof v === 'number' ? Math.max(0, Math.min(v, maxR)) : (v && typeof v.x === 'number' ? Math.max(0, Math.min(v.x, maxR)) : 0); };
            if (radii.length === 1) { tl = tr = br = bl = getR(radii[0]); }
            else if (radii.length === 2) { tl = br = getR(radii[0]); tr = bl = getR(radii[1]); }
            else if (radii.length === 3) { tl = getR(radii[0]); tr = bl = getR(radii[1]); br = getR(radii[2]); }
            else if (radii.length >= 4) { tl = getR(radii[0]); tr = getR(radii[1]); br = getR(radii[2]); bl = getR(radii[3]); }
          }
          this.moveTo(rx + tl, ry);
          this.arcTo(rx + rw, ry, rx + rw, ry + rh, tr);
          this.arcTo(rx + rw, ry + rh, rx, ry + rh, br);
          this.arcTo(rx, ry + rh, rx, ry, bl);
          this.arcTo(rx, ry, rx + rw, ry, tl);
          this.closePath();
          return this;
        };
      }
      if (typeof CanvasRenderingContext2D !== 'undefined') polyfill(CanvasRenderingContext2D.prototype);
      if (typeof Path2D !== 'undefined') polyfill(Path2D.prototype);
    })();
  </script>

      left: 0;

      cursor: pointer;
